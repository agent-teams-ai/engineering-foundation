          GH_TOKEN: ${{ github.token }}

  windows-check:
    name: ${{ (github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))) && 'windows-check' || 'ci-not-requested-windows-check' }}
    needs:
      - dependency-review
      - node26-compatibility
      - windows-static
      - windows-test-a
      - windows-test-b
      - windows-test-c
      - windows-test-d
      - windows-test-e
      - windows-package
      - windows-registry
      - windows-published
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))) }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Windows and Node compatibility lane
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030 # post-v1.2.2 injection fix, exact reviewed commit
        with:
          jobs: ${{ toJSON(needs) }}

  macos-native:
    name: macos-native
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun tools/dev.mts install
      - run: bun tools/dev.mts build
      - name: Qualify managed process transport under pinned Bun on Darwin
        shell: bash
        run: |
          set -Eeuo pipefail
          PROCESS_RUNTIME_DELEGATION_NODE="$(node -p 'process.execPath')"
          AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE="${PROCESS_RUNTIME_DELEGATION_NODE}"
          AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE="$(bun -p 'process.execPath')"
          export PROCESS_RUNTIME_DELEGATION_NODE AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE
          "${AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE}" tests/process-runtime-delegation-under-bun.mts
      - name: Qualify QGR lifecycle on Darwin
        run: bun tools/dev.mts test:qgr:lifecycle:built
      - name: Qualify packaging containment and required Darwin controls
        run: node scripts/run-selected-tests.mjs tests/tooling.test.mjs
      - name: Qualify repository mutation, scaffolding, and durable document writing
        run: >-
          node scripts/run-selected-tests.mjs
          tests/repository-mutation-*.test.mjs
          tests/known-file-transaction-node.test.mjs
          tests/known-file-transaction-plan.test.mjs
          tests/scaffolding-authority.test.mjs
          tests/scaffolding-recovery-scope.test.mjs
          tests/document-authoring-application-use-cases.test.mjs
          tests/document-authoring-journal-store.test.mjs
          tests/document-authoring-node-writer-adapters.test.mjs
          tests/document-authoring-public-writer.test.mjs
          tests/document-authoring-writer-*.test.mjs
          tests/document-authoring-scaffolding-race.test.mjs

  macos-package:
    name: macos-package (${{ matrix.profile }})
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE: node
    strategy:
      fail-fast: false
      matrix:
        profile: [foundation, npm-docs, pnpm-docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use a finite job-owned temporary directory
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpdir="${RUNNER_TEMP}/macos-package-${QUALIFICATION_PROFILE}"
          mkdir -p "${tmpdir}"
          printf 'TMPDIR=%s\n' "${tmpdir}" >> "$GITHUB_ENV"
        env:
          QUALIFICATION_PROFILE: ${{ matrix.profile }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        id: setup-pnpm
        with: { version: "11.20.0", install: false }
      # Managed generation2 consumer gates run on an explicit Node 24; the default Node 26 stays on PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.21.0" }
      - name: Retain Node 24 for managed generation2 consumer gates
        run: printf 'PACK_TEST_GENERATION2_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Install the clean Node/pnpm package projection
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_SHA: ${{ github.sha }}
          AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tools/dev.mts --profile node install
      - run: node tools/dev.mts --profile node build
      - name: Qualify paired packed and registry-installed boundaries
        run: node scripts/qualify-package-artifacts.mts "$QUALIFICATION_PROFILE"
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
        env:
          QUALIFICATION_PROFILE: ${{ matrix.profile }}
          AGENT_TEAMS_FOUNDATION_SOURCE_ROOT: ${{ github.workspace }}

  macos-qualification:
    name: ${{ (github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))) && 'macos-qualification' || 'ci-not-requested-macos-qualification' }}
    needs: [dependency-review, macos-native, macos-package]
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native Darwin witness and package profile
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030 # post-v1.2.2 injection fix, exact reviewed commit
        with:
          jobs: ${{ toJSON(needs) }}

  full-ci:
    # All required contexts isolate unrelated labels, even when GitHub skips jobs.
    # Run alongside the native aggregates, preserving their original timeouts.
    name: ${{ (github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))) && 'full-ci' || 'ci-not-requested' }}
    needs:
      - dependency-review
      - node26-compatibility
      - linux-static
      - linux-tests
      - linux-coverage
      - linux-package
      - linux-registry
      - linux-bootstrap-evidence
      - linux-published
      - windows-static
      - windows-test-a
      - windows-test-b
      - windows-test-c
      - windows-test-d
      - windows-test-e
      - windows-package
      - windows-registry
      - windows-published
      - macos-native
      - macos-package
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the complete native qualification
        if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030 # post-v1.2.2 injection fix, exact reviewed commit
        with:
          jobs: ${{ toJSON(needs) }}
