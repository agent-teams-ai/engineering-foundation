packages:
  - "packages/*"
  - "spikes/*"

# pnpm 11 reads these install policy settings from the workspace manifest.
engineStrict: true
strictPeerDependencies: true
saveExact: true

catalogMode: strict

catalog:
  oxfmt: 0.74.0
  tsrs: 0.18.0-ts7.1.0-dev.20260929
  bun: 1.4.3
  "@ast-grep/cli": 0.45.0
  "@changesets/changelog-github": 0.7.0
  "@changesets/cli": 2.31.1
  "@microsoft/api-extractor-model": 7.33.10
  "@microsoft/tsdoc": 0.16.0
  "@modelcontextprotocol/server": 2.0.0
  "@openai/codex": 0.146.0
  "@types/node": 24.13.3
  '@types/proper-lockfile': 4.1.4
  ajv: 8.20.0
  ajv-formats: 3.0.1
  c8: 12.0.0
  esbuild: 0.28.2
  fast-check: 4.9.0
  github-slugger: 2.0.0
  jsonc-parser: 3.3.1
  knip: 6.31.0
  minisearch: 7.2.0
  mdast-util-to-string: 4.0.0
  node-or-bun: 0.2.5
  nx: 23.3.0
  oxlint: 1.83.0
  oxlint-tsgolint: 7.0.2001
  oxc-parser: 0.142.0
  proper-lockfile: 4.1.2
  pnpm: 11.20.0
  publint: 0.3.22
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  semver: 7.8.5
  typescript: 7.0.2
  unified: 11.0.5
  unist-util-visit: 5.1.0
  verdaccio: 6.10.6
  vfile: 6.0.3
  yaml: 2.9.0

minimumReleaseAge: 0

allowBuilds:
  "@ast-grep/cli": true
  esbuild: false # Use the lockfile-pinned optional platform binary, without postinstall downloads.
  nx: true

overrides:
  brace-expansion: 5.0.12
  # Keep Knip's compatible parser patched; see docs/security/dependency-triage.md.
  smol-toml: 1.9.0
  # Nx 23.3.0 pins the affected 7.29.0 client; qualify the patched 7.x release.
  undici: 7.29.1
