          cat "$EVIDENCE/managed.merged.log"
          printf '%s\n' "$code" > "$EVIDENCE/managed.exit.txt"
          exit "$code"
      - name: Provision existing qualified npm migration verifier
        id: npmverifier
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -uo pipefail
          prefix="${RUNNER_TEMP}/test-format-npm-verifier"
          mkdir -p "$prefix"
          printf '%s\n' npm install --prefix "$prefix" --no-save --package-lock=false --ignore-scripts npm@11.19.0 > "$EVIDENCE/npm-verifier.argv.txt"
          if npm install --prefix "$prefix" --no-save --package-lock=false --ignore-scripts npm@11.19.0 > "$EVIDENCE/npm-verifier.merged.log" 2>&1; then code=0; else code=$?; fi
          cat "$EVIDENCE/npm-verifier.merged.log"
          if [[ "$code" -eq 0 ]]; then
            export PATH="$prefix/node_modules/.bin:$PATH"
            { command -v npm; npm --version; } > "$EVIDENCE/npm-verifier.selection.txt"
            test "$(npm --version)" = 11.19.0 || code=$?
            if [[ "$code" -eq 0 ]]; then printf '%s\n' "$prefix/node_modules/.bin" >> "$GITHUB_PATH"; fi
          fi
          printf '%s\n' "$code" > "$EVIDENCE/npm-verifier.exit.txt"
          exit "$code"
      - name: Retain raw Oxlint rule inventory diagnostic
        id: oxlintdiagnostic
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          cli="$(node -p 'require.resolve("oxlint/package.json")')"
          cli="$(dirname "$cli")/bin/oxlint"
          printf '%s\n' "node $cli --rules --format=json" > "$EVIDENCE/oxlint.argv.txt"
          if node "$cli" --rules --format=json > "$EVIDENCE/oxlint.stdout.txt" 2> "$EVIDENCE/oxlint.stderr.txt"; then code=0; else code=$?; fi
          printf '%s\n' "$code" > "$EVIDENCE/oxlint.exit.txt"
          exit "$code"
      - name: Retain exact pnpm manager-pack stdout stderr and safe debug
        id: npmpackdiagnostic
        if: ${{ !cancelled() && steps.npmverifier.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          { command -v npm; npm --version; } > "$EVIDENCE/npm-pack.npm-selection.txt"
          test "$(npm --version)" = 11.19.0 || exit 1
          manager="$(node --input-type=module -e 'console.log(import.meta.resolve("pnpm"))')"
          manager="$(dirname "${manager#file://}")"
          root="$(mktemp -d "$TMPDIR/manager-pack-XXXXXX")"
          mkdir "$root/npm-cache"
          printf 'manager=%s\nroot=%s\n' "$manager" "$root" > "$EVIDENCE/npm-pack.binding.txt"
          printf '%s\n' npm pack --ignore-scripts --json --pack-destination "$root" > "$EVIDENCE/npm-pack.argv.txt"
          if (cd "$manager" && npm_config_cache="$root/npm-cache" npm pack --ignore-scripts --json --pack-destination "$root") > "$EVIDENCE/npm-pack.stdout.txt" 2> "$EVIDENCE/npm-pack.stderr.txt"; then code=0; else code=$?; fi
          printf '%s\n' "$code" > "$EVIDENCE/npm-pack.exit.txt"
          if [[ -d "$root/npm-cache/_logs" ]]; then
            find "$root/npm-cache/_logs" -name '*debug*.log' -type f -print0 | while IFS= read -r -d '' file; do
              printf 'log=%s\n' "$file"
              sed -nE '/^[0-9]+ (error|verbose (stack|title|cwd|node|npm|exit|code)) /p' "$file"
            done > "$EVIDENCE/npm-pack-safe-debug.txt"
          else
            printf '%s\n' no-log-directory > "$EVIDENCE/npm-pack-safe-debug.txt"
          fi
          exit "$code"
      - name: Measure actual Unix socket path budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d "$TMPDIR/fs-socket-XXXXXX")"
          path="$root/.agent-teams-local/scaffolding-transaction.json"
          printf 'TMPDIR=%s\nRUNNER_TEMP=%s\npath=%s\npath_bytes=%s\nlinux_sun_path_max_including_NUL=108\n' "$TMPDIR" "$RUNNER_TEMP" "$path" "$(printf %s "$path" | wc -c)" > "$EVIDENCE/socket-path-budget.txt"
          rmdir "$root"
      - name: Existing focused tests with untruncated TAP causes
        id: focused
        if: ${{ !cancelled() && steps.npmverifier.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TEMP: ${{ runner.temp }}/f
        shell: bash
        run: |
          set -uo pipefail
          { command -v npm; npm --version; } > "$EVIDENCE/focused.npm-selection.txt"
          test "$(npm --version)" = 11.19.0 || exit 1
          args=(--test --test-concurrency=1 --test-reporter=tap --test-name-pattern='admits the complete built Foundation package inventory|nested pnpm scripts keep packaged consumers|rejects a Unix socket journal|JS exception covers exactly' tests/package-archive-entry-budget.test.mjs tests/public-docs-documented.test.ts tests/scaffolding-adversarial.test.mjs packages/stack-toolchain/tests/lint-presets.test.ts)
          printf '%s\n' node "${args[@]}" > "$EVIDENCE/focused.argv.txt"
          if node "${args[@]}" > "$EVIDENCE/focused.stdout.txt" 2> "$EVIDENCE/focused.stderr.txt"; then code=0; else code=$?; fi
          printf '%s\n' "$code" > "$EVIDENCE/focused.exit.txt"
          cat "$EVIDENCE/focused.stdout.txt" "$EVIDENCE/focused.stderr.txt"
          exit "$code"
      - name: Always retain honest outcomes and terminal source custody
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          MANAGED_RESULT: ${{ steps.managed.outcome }}
          NPM_VERIFIER_RESULT: ${{ steps.npmverifier.outcome }}
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
          OXLINT_DIAGNOSTIC_RESULT: ${{ steps.oxlintdiagnostic.outcome }}
          NPMPACK_DIAGNOSTIC_RESULT: ${{ steps.npmpackdiagnostic.outcome }}
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -uo pipefail
          evidence="${RUNNER_TEMP}/test-format-coverage"
          mkdir -p "$evidence"
          printf 'install=%s\nbuild=%s\nmanaged=%s\nnpm_verifier=%s\nfocused=%s\noxlint_diagnostic=%s\nnpm_pack_diagnostic=%s\nqualification=focused-diagnostic-only\n' "$INSTALL_RESULT" "$BUILD_RESULT" "$MANAGED_RESULT" "$NPM_VERIFIER_RESULT" "$FOCUSED_RESULT" "$OXLINT_DIAGNOSTIC_RESULT" "$NPMPACK_DIAGNOSTIC_RESULT" > "$evidence/phase-outcomes.txt"
          printf 'repository=%s\nref=%s\nevent=%s\nrun_id=%s\nattempt=%s\nprovider_T=%s\nworkflow_sha=%s\nsource_S=%s\nbase=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$WORKFLOW_SHA" "$SUBJECT_SHA" "$BASE_SHA" > "$evidence/provider-binding.txt"
          code=0
          if [[ -f "$evidence/source.sha256" ]]; then sha256sum -c "$evidence/source.sha256" > "$evidence/source-after.txt" 2>&1 || code=1; else code=1; fi
          git diff --exit-code HEAD > "$evidence/tracked-after.txt" 2>&1 || code=1
          git ls-files --others --exclude-standard > "$evidence/untracked-after.txt" || code=1
          test ! -s "$evidence/untracked-after.txt" || code=1
          sha256sum bun.lock pnpm-lock.yaml .node-version architecture/foundation/repository-runtime.json toolchain.config.json > "$evidence/pins-after.txt" 2>&1 || code=1
          shopt -s nullglob
          for file in .worker-tmp/check-changed-*.log; do cp "$file" "$evidence/$(basename "$file")"; done
          df -B1 "$RUNNER_TEMP" > "$evidence/resources-after.txt"
          for file in "${RUNNER_TEMP}"/test-format-fixtures/quality-source-cli-failure-*/invocation.json; do cp "$file" "$evidence/$(basename "$(dirname "$file")").json"; done
          printf '%s\n' "$code" > "$evidence/terminal-custody.exit.txt"
          find "$evidence" -maxdepth 1 -type f ! -name artifacts.sha256 ! -name artifact-sizes.txt -printf '%f %s\n' | LC_ALL=C sort > "$evidence/artifact-sizes.txt"
          (cd "$evidence" && find . -maxdepth 1 -type f ! -name artifacts.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$evidence/artifacts.sha256"
          exit "$code"
      - name: Upload only explicit TEST evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TEST-format-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-format-coverage/
          if-no-files-found: error
          retention-days: 30
