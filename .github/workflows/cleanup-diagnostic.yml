name: Cleanup diagnostic
on:
  push:
    branches: [test/cleanup-qualified-tools-462]
permissions:
  contents: read
  actions: write
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retire only obsolete PR 462 runs and collect current evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo = 'repos/agent-teams-ai/engineering-foundation'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cleanup-evidence'
          out.mkdir()
          def api(endpoint, method='GET'):
              result = subprocess.run(['gh', 'api', '--method', method, repo + endpoint], capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout) if result.stdout.strip() else None
          expected = 'ac01d55e1a55ed6a7a4e53c74f9ea97219f44cc5'
          expected_base = '1fb16560e6972909e68fb36b9b005bf16273cbea'
          def require_current():
              pr = api('/pulls/462')
              assert pr['state'] == 'open' and not pr['merged']
              assert pr['head']['sha'] == expected and pr['base']['sha'] == expected_base
              return pr
          pr = require_current()
          report = {'head': expected, 'base': expected_base, 'obsoleteRuns': [], 'runs': []}
          obsolete = {
              41747135547: '6ef116c1ea9010569cfcfd827c7d72f9c3bf9e6b',
              41750377421: '76e1021ca028b3da3b36cac8e1a9b0e18917850a',
          }
          for run_id, old_head in obsolete.items():
              run = api(f'/actions/runs/{run_id}')
              assert run['head_sha'] == old_head and run['head_sha'] != expected
              assert run['event'] == 'pull_request' and run['path'] == '.github/workflows/ci.yml'
              assert any(item['number'] == 462 for item in run['pull_requests'])
              item = {'id': run_id, 'head': old_head, 'before': run['status'], 'cancelRequested': False}
              if run['status'] in ('queued', 'in_progress', 'pending', 'waiting'):
                  require_current()
                  try:
                      api(f'/actions/runs/{run_id}/cancel', 'POST')
                      item['cancelRequested'] = True
                  except RuntimeError as error:
                      item['cancelRequestError'] = str(error)
              observed = api(f'/actions/runs/{run_id}')
              item.update({'observedStatus': observed['status'], 'observedConclusion': observed['conclusion']})
              report['obsoleteRuns'].append(item)
          for run_id in (41750883183, 41750837894, 41750838013, 41750869890):
              run = api(f'/actions/runs/{run_id}')
              jobs = []
              for page in range(1, 5):
                  response = api(f'/actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}')
                  current = response.get('jobs', [])
                  jobs.extend(current)
                  if len(current) < 100:
                      break
              (out / f'run-{run_id}.json').write_text(json.dumps({'run': run, 'jobs': jobs}, indent=2))
              summary = {k: run.get(k) for k in ('id', 'name', 'head_sha', 'status', 'conclusion', 'run_attempt', 'html_url')}
              summary['jobs'] = [{k: j.get(k) for k in ('id', 'name', 'status', 'conclusion')} for j in jobs]
              report['runs'].append(summary)
              for job in jobs:
                  if job.get('conclusion') != 'failure':
                      continue
                  log = subprocess.run(['gh', 'api', repo + f'/actions/jobs/{job["id"]}/logs'], capture_output=True, timeout=30)
                  lines = log.stdout.decode('utf-8-sig', errors='replace').splitlines()
                  selected = set(range(max(0, len(lines) - 50), len(lines)))
                  needles = ('not ok', 'AssertionError', 'error TS', '##[error]', 'PUBLIC_API_', 'violations', 'failed', 'failure')
                  for i, line in enumerate(lines):
                      if any(needle in line for needle in needles):
                          selected.update(range(max(0, i - 2), min(len(lines), i + 12)))
                  (out / f'failed-job-{job["id"]}.log').write_text('\n'.join(lines[i] for i in sorted(selected))[-50000:])
          require_current()
          (out / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          print('Only the enumerated obsolete runs were eligible for cancellation. Current runs, workflows, branches, protections and reviewer settings were not modified.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cleanup-evidence
          retention-days: 3
