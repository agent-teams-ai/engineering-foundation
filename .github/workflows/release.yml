name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pullRequestNumber: ${{ steps.release-pr.outputs.number }}
      pullRequestBaseSha: ${{ steps.release-pr.outputs.base_sha }}
      pullRequestHeadSha: ${{ steps.release-pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Guard public package bootstrap baselines
        run: node scripts/npm-package-bootstrap-cli.mjs check-release
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          createGithubReleases: false
          publish: pnpm release:publish
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind release pull request revision
        id: release-pr
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROCESSED_MAIN_SHA: ${{ github.sha }}
          RELEASE_PULL_REQUEST: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -Eeuo pipefail

          pull_request_json="$(mktemp)"
          stable_pull_request_json="$(mktemp)"
          files_json="$(mktemp)"
          proof_error="$(mktemp)"
          trap 'rm -f "${pull_request_json}" "${stable_pull_request_json}" "${files_json}" "${proof_error}"' EXIT

          release_branch_revision() {
            local line sha ref extra
            line="$(git ls-remote --refs origin refs/heads/changeset-release/main)"
            read -r sha ref extra <<< "${line}"
            if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ || "${ref}" != "refs/heads/changeset-release/main" || -n "${extra:-}" ]]; then
              echo "Release branch does not resolve to one exact revision." >&2
              return 1
            fi
            printf '%s\n' "${sha}"
          }

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            branch_head_sha="$(release_branch_revision)"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${pull_request_json}"
            read -r number state head_ref head_sha base_ref base_sha < <(jq -r \
              '[.number, .state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv' \
              "${pull_request_json}")
            if [[ ! "${number}" =~ ^[1-9][0-9]*$ || "${number}" != "${RELEASE_PULL_REQUEST}" || \
              "${state}" != "open" || "${head_ref}" != "changeset-release/main" || \
              "${base_ref}" != "main" || ! "${head_sha}" =~ ^[0-9a-f]{40}$ || \
              ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Changesets output does not identify the expected open release pull request." >&2
              exit 1
            fi

            current_main_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ ! "${PROCESSED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ || \
              ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release binding received a malformed main revision." >&2
              exit 1
            fi
            git fetch --no-tags origin \
              "${PROCESSED_MAIN_SHA}" "${current_main_sha}" "${base_sha}" "${head_sha}" \
              "${branch_head_sha}"
            : > "${proof_error}"
            if jq -n \
              --arg currentMainSha "${current_main_sha}" \
              --arg expectedBaseSha "${PROCESSED_MAIN_SHA}" \
              --arg expectedHeadSha "${branch_head_sha}" \
              --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
              --slurpfile pullRequest "${pull_request_json}" \
              '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
              node scripts/check-release-pr-freshness.mjs \
                --processed-main "${PROCESSED_MAIN_SHA}" 2> "${proof_error}" && \
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}/files?per_page=100" > \
                "${files_json}" && \
              node scripts/check-release-pr-files.mjs \
                --base "${base_sha}" --head "${head_sha}" < "${files_json}" 2>> "${proof_error}"; then
              stable_branch_head_sha="$(release_branch_revision)"
              stable_current_main_sha="$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > \
                "${stable_pull_request_json}"
              read -r stable_number stable_state stable_head_ref stable_head_sha \
                stable_base_ref stable_base_sha < <(jq -r \
                '[.number, .state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv' \
                "${stable_pull_request_json}")
              if [[ "${stable_number}" == "${number}" && "${stable_state}" == "${state}" && \
                "${stable_head_ref}" == "${head_ref}" && "${stable_head_sha}" == "${head_sha}" && \
                "${stable_base_ref}" == "${base_ref}" && "${stable_base_sha}" == "${base_sha}" && \
                "${stable_branch_head_sha}" == "${branch_head_sha}" && \
                "${stable_current_main_sha}" == "${current_main_sha}" ]]; then
                {
                  printf 'number=%s\n' "${number}"
                  printf 'base_sha=%s\n' "${base_sha}"
                  printf 'head_sha=%s\n' "${head_sha}"
                } >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
            sleep 1
          done

          echo "Release pull request revision did not converge on complete exact-head evidence." >&2
          cat "${proof_error}" >&2
          exit 1

  attest-release-pr:
    name: attest-release-pr
    needs: release
    if: ${{ needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: write
    runs-on: ubuntu-24.04
    # 55m CI + 60s final + 30s selection + 15s polling overshoot;
    # 3 passes x 4 contexts x (3 attempts x 3 requests x (3s + 1s kill grace)
    # + 2 x 1s backoff) = 456s for pending, terminal publication and recovery.
    # Reserve 180s for setup/other work and at least 120s margin (4161s total).
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dispatch and attest release pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_BASE_SHA: ${{ needs.release.outputs.pullRequestBaseSha }}
          EXPECTED_RELEASE_HEAD_SHA: ${{ needs.release.outputs.pullRequestHeadSha }}
          PROCESSED_MAIN_SHA: ${{ github.sha }}
          RELEASE_PULL_REQUEST: ${{ needs.release.outputs.pullRequestNumber }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          ci_contexts=(check windows-check macos-qualification)
          attestation_contexts=(analyze "${ci_contexts[@]}")
          head_sha="${EXPECTED_RELEASE_HEAD_SHA}"
          status_finalized=0

          post_status() {
            local context="$1"
            local status_state="$2"
            local description="$3"
            local target_url="$4"
            local attempt creator statuses
            # GITHUB_TOKEN is the GitHub Actions installation token, not the actor's
            # token. Resolve its documented bot login through the API (no pinned ID).
            # Always read effective latest statuses, including after a lost response.
            for attempt in 1 2 3; do
              if [[ -z "${status_creator_id:-}" ]]; then
                if creator="$(trap - ERR; timeout --kill-after=1s 3s gh api 'users/github-actions[bot]')" &&
                  status_creator_id="$(trap - ERR; jq -er '
                    select(.login == "github-actions[bot]" and .type == "Bot") |
                    .id | select(type == "number" and . > 0 and floor == .)
                  ' <<<"${creator}")"; then
                  :
                else
                  status_creator_id=""
                fi
              fi
              if [[ -n "${status_creator_id}" ]]; then
                # A command failure does not tell us whether GitHub accepted a write.
                if timeout --kill-after=1s 3s gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
                  -f state="${status_state}" \
                  -f context="${context}" \
                  -f description="${description}" \
                  -f target_url="${target_url}" >/dev/null; then
                  :
                fi
                # List pages retain newest-first order and historical duplicates.
                # The requested endpoint binds the SHA; entries have no sha field.
                # The top-level avatar identifies the GitHub Actions app (15368).
                if statuses="$(trap - ERR; timeout --kill-after=1s 3s gh api --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}?per_page=100")" &&
                  jq -e --arg context "${context}" \
                    --arg state "${status_state}" --arg description "${description}" \
                    --arg target "${target_url}" --argjson creator "${status_creator_id}" '
                    type == "array" and length > 0 and
                    all(.[]; type == "array") and
                    all(.[][]; type == "object" and (.context | type) == "string") and
                    ([.[][] | select((.context | ascii_downcase) == ($context | ascii_downcase))] |
                      .[0] | type == "object" and
                        .context == $context and
                        .state == $state and .description == $description and
                        .target_url == $target and .creator.id == $creator and
                        .creator.login == "github-actions[bot]" and .creator.type == "Bot" and
                        .avatar_url == "https://avatars.githubusercontent.com/in/15368?v=4")
                  ' <<<"${statuses}" >/dev/null; then
                  return 0
                fi
              fi
              if (( attempt < 3 )); then sleep 1; fi
            done
            echo "::error::Unreconciled status: ${context}; intended ${status_state} on ${head_sha}" >&2
            return 1
          }

          mark_attestation_error() {
            local exit_code="$?"
            local context
            local unreconciled=()
            trap - ERR
            if (( status_finalized == 0 )); then
              for context in "${attestation_contexts[@]}"; do
                if ! post_status "${context}" error "Release PR attestation failed" "${RELEASE_RUN_URL}"; then
                  unreconciled+=("${context}")
                fi
              done
              if (( ${#unreconciled[@]} > 0 )); then
                # During a total outage an ambiguous success can remain remote.
                # Report uncertainty; never claim that recovery completed.
                echo "::error::Recovery incomplete; unreconciled contexts: ${unreconciled[*]}" >&2
              fi
            fi
            exit "${exit_code}"
          }

          fail_attestation() {
            local description="$1"
            for context in "${attestation_contexts[@]}"; do
              post_status "${context}" failure "${description}" "${RELEASE_RUN_URL}"
            done
            exit 1
          }

          fetch_paginated_pages() {
            gh api --paginate --slurp "$@"
          }

          paginated_object_collection() {
            local collection="$1"
            jq -ce --arg collection "${collection}" '
              if type != "array" or length == 0 or
                any(.[]; type != "object" or (.[$collection] | type) != "array")
              then error("malformed paginated object collection")
              else
                .[0].total_count as $total |
                [.[].[$collection][]] as $items |
                if ($total | type) != "number" or $total < 0 or
                  ($total | floor) != $total or
                  any(.[]; .total_count != $total)
                then error("malformed paginated object count")
                elif ($items | length) != $total
                then error("incomplete paginated object collection")
                else {($collection): $items}
                end
              end'
          }

          paginated_array_collection() {
            jq -ce '
              if type != "array" or length == 0 or any(.[]; type != "array")
              then error("malformed paginated array collection")
              else [ .[][] ]
              end'
          }

          validate_codeql_collection() {
            local collection="$1"
            node scripts/check-release-codeql-evidence.mjs \
              --collection "${collection}"
          }

          validate_codeql_observation() {
            local observation="$1"
            node scripts/check-release-codeql-evidence.mjs \
              --observation "${observation}" \
              --api "${GITHUB_API_URL}" \
              --repository "${GITHUB_REPOSITORY}" \
              --server "${GITHUB_SERVER_URL}" \
              --run "${codeql_run_id}" \
              --pr "${RELEASE_PULL_REQUEST}" \
              --branch changeset-release/main \
              --base "${base_sha}" \
              --head "${head_sha}"
          }

          trap mark_attestation_error ERR

          pull_request_json="$(mktemp)"
          final_pull_request_json="$(mktemp)"
          codeql_evidence_error="$(mktemp)"
          trap 'rm -f "${pull_request_json}" "${final_pull_request_json}" "${codeql_evidence_error}"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${pull_request_json}"
          read -r head_sha base_sha < <(jq -r \
            '[.head.sha, .base.sha] | @tsv' "${pull_request_json}")
          current_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "${EXPECTED_RELEASE_BASE_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${EXPECTED_RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${PROCESSED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${base_sha}" =~ ^[0-9a-f]{40}$ || ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            fail_attestation "Release PR revision tuple is malformed"
          fi

          for context in "${attestation_contexts[@]}"; do
            post_status "${context}" pending "Release PR ${context}: dispatched" "${RELEASE_RUN_URL}"
          done

          git fetch --no-tags origin \
            "${PROCESSED_MAIN_SHA}" "${current_main_sha}" "${base_sha}" "${head_sha}"
          if ! jq -n \
            --arg currentMainSha "${current_main_sha}" \
            --arg expectedBaseSha "${EXPECTED_RELEASE_BASE_SHA}" \
            --arg expectedHeadSha "${EXPECTED_RELEASE_HEAD_SHA}" \
            --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
            --slurpfile pullRequest "${pull_request_json}" \
            '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
            node scripts/check-release-pr-freshness.mjs \
              --processed-main "${PROCESSED_MAIN_SHA}"; then
            fail_attestation "Release PR is stale or incomplete"
          fi
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}/files?per_page=100" | \
            node scripts/check-release-pr-files.mjs --base "${base_sha}" --head "${head_sha}"; then
            fail_attestation "Release PR contains unreviewed changes"
          fi

          bound_run_id=""
          bound_run_url=""
          bound_run_event=""
          selection_deadline=$((SECONDS + 30))
          while :; do
            if ! candidate_runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=pull_request \
              -f branch=changeset-release/main \
              -f head_sha="${head_sha}" \
              -f per_page=100)"; then
              if (( SECONDS >= selection_deadline )); then
                break
              fi
              sleep 5
              continue
            fi
            if ! selected_run="$(node scripts/select-release-ci-run.mjs \
              --repository "${GITHUB_REPOSITORY}" \
              --server "${GITHUB_SERVER_URL}" \
              --pr "${RELEASE_PULL_REQUEST}" \
              --branch changeset-release/main \
              --base "${base_sha}" \
              --head "${head_sha}" <<<"${candidate_runs}")"; then
              fail_attestation "Release PR CI run selection was ambiguous or malformed"
            fi
            bound_run_id="$(jq -r '.id // ""' <<<"${selected_run}")"
            bound_run_url="$(jq -r '.url // ""' <<<"${selected_run}")"
            bound_run_event="$(jq -r '.event // ""' <<<"${selected_run}")"
            if [[ -n "${bound_run_id}" ]]; then
              break
            fi
            if (( SECONDS >= selection_deadline )); then
              break
            fi
            sleep 5
          done

          if [[ -z "${bound_run_id}" ]]; then
            dispatch_response="$(gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              -f ref=changeset-release/main \
              -F return_run_details=true)"
            bound_run_id="$(jq -r '.workflow_run_id // ""' <<<"${dispatch_response}")"
            bound_run_url="$(jq -r '.html_url // ""' <<<"${dispatch_response}")"
            bound_run_event=workflow_dispatch
          fi
          expected_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${bound_run_id}"
          if [[ ! "${bound_run_id}" =~ ^[1-9][0-9]*$ || \
            "${bound_run_url}" != "${expected_run_url}" || \
            ( "${bound_run_event}" != "pull_request" && \
              "${bound_run_event}" != "workflow_dispatch" ) ]]; then
            fail_attestation "Release PR CI did not resolve to one exact run"
          fi

          codeql_dispatch_response="$(gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/dispatches" \
            -f ref=changeset-release/main \
            -F return_run_details=true)"
          codeql_run_id="$(jq -r '.workflow_run_id // ""' <<<"${codeql_dispatch_response}")"
          codeql_run_url="$(jq -r '.html_url // ""' <<<"${codeql_dispatch_response}")"
          expected_codeql_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}"
          if [[ ! "${codeql_run_id}" =~ ^[1-9][0-9]*$ || \
            "${codeql_run_url}" != "${expected_codeql_run_url}" ]]; then
            fail_attestation "Release PR CodeQL did not resolve to one exact run"
          fi

          deadline=$((SECONDS + 3300))
          bound_run_attempt=""
          all_completed=0
          while (( SECONDS < deadline )); do
            if ! bound_run="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${bound_run_id}")"; then
              sleep 5
              continue
            fi
            read -r run_id run_path run_event run_head_branch run_head_sha \
              bound_run_attempt run_url run_head_repository run_pull_request_count \
              run_pull_request_number run_pull_request_head_ref \
              run_pull_request_head_sha run_pull_request_base_ref \
              run_pull_request_base_sha run_status run_conclusion < <(jq -r \
              '[.id, .path, .event, .head_branch, .head_sha, .run_attempt,
                .html_url, .head_repository.full_name, (.pull_requests | length),
                (.pull_requests[0].number // "missing"), (.pull_requests[0].head.ref // "missing"),
                (.pull_requests[0].head.sha // "missing"), (.pull_requests[0].base.ref // "missing"),
                (.pull_requests[0].base.sha // "missing"), .status, .conclusion // ""] | @tsv' \
              <<<"${bound_run}")
            if [[ "${run_id}" != "${bound_run_id}" || \
              "${run_path}" != ".github/workflows/ci.yml" || \
              "${run_event}" != "${bound_run_event}" || \
              "${run_head_branch}" != "changeset-release/main" || \
              "${run_head_sha}" != "${head_sha}" || \
              "${bound_run_attempt}" != "1" || \
              "${run_url}" != "${bound_run_url}" || \
              "${run_head_repository}" != "${GITHUB_REPOSITORY}" ]]; then
              fail_attestation "Release PR CI dispatch resolved to unexpected evidence"
            fi
            if [[ "${run_event}" == "pull_request" || \
              "${run_pull_request_count}" != "0" ]]; then
              if [[ "${run_pull_request_count}" != "1" || \
                "${run_pull_request_number}" != "${RELEASE_PULL_REQUEST}" || \
                "${run_pull_request_head_ref}" != "changeset-release/main" || \
                "${run_pull_request_head_sha}" != "${head_sha}" || \
                "${run_pull_request_base_ref}" != "main" || \
                "${run_pull_request_base_sha}" != "${base_sha}" ]]; then
                fail_attestation "Release PR CI run has unexpected pull request provenance"
              fi
            fi

            if ! jobs="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${bound_run_id}/attempts/${bound_run_attempt}/jobs?per_page=100")"; then
              sleep 5
              continue
            fi
            all_completed=1
            for context in "${ci_contexts[@]}"; do
              read -r job_count job_status < <(jq -r --arg context "${context}" \
                '[.jobs[] | select(.name == $context)] |
                [length, first.status // "missing"] | @tsv' \
                <<<"${jobs}")
              if (( job_count > 1 )); then
                fail_attestation "Release PR CI contains duplicate required jobs"
              fi
              if (( job_count == 0 )) && [[ "${run_status}" == "completed" ]]; then
                fail_attestation "Release PR CI completed without required jobs"
              fi
              if [[ "${job_status}" != "completed" ]]; then
                all_completed=0
              fi
            done
            if (( all_completed == 1 )) && [[ "${run_status}" == "completed" ]]; then
              break
            fi
            sleep 5
          done

          if (( all_completed != 1 )); then
            for context in "${attestation_contexts[@]}"; do
              post_status "${context}" error "Release PR ${context}: CI timeout" "${RELEASE_RUN_URL}"
            done
            echo "Timed out waiting for release pull request CI." >&2
            exit 1
          fi

          failed=0
          if [[ "${run_conclusion}" != "success" ]]; then
            failed=1
          fi
          conclusions=()
          target_urls=()
          for context in "${ci_contexts[@]}"; do
            read -r conclusion target_url < <(jq -r --arg context "${context}" \
              --arg runUrl "${bound_run_url}" \
              '[.jobs[] | select(.name == $context)] | first |
              [.conclusion // "missing", .html_url // $runUrl] | @tsv' \
              <<<"${jobs}")
            case "${conclusion}" in
              success)
                ;;
              failure|cancelled|timed_out|startup_failure)
                failed=1
                ;;
              *)
                failed=1
                ;;
            esac
            conclusions+=("${conclusion}")
            target_urls+=("${target_url}")
          done

          if (( failed != 0 )); then
            post_status analyze failure "Release PR CI failed" "${RELEASE_RUN_URL}"
            for index in "${!ci_contexts[@]}"; do
              post_status "${ci_contexts[index]}" failure \
                "Release PR ${ci_contexts[index]}: ${conclusions[index]}" \
                "${target_urls[index]}"
            done
            exit 1
          fi

          codeql_receipt=""
          while (( SECONDS < deadline )); do
            if ! codeql_run="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}")"; then
              sleep 5
              continue
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n --argjson run "${codeql_run}" \
              '{run: $run}' | validate_codeql_observation run \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL workflow evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            if ! codeql_job_pages="$(fetch_paginated_pages \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}/attempts/1/jobs?per_page=100")"; then
              sleep 5
              continue
            fi
            if ! codeql_jobs="$(paginated_object_collection jobs \
              <<<"${codeql_job_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection jobs <<<"${codeql_jobs}"; then
              fail_attestation "Release PR CodeQL jobs evidence is malformed"
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              '{run: $run, jobs: $jobs}' | validate_codeql_observation jobs \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL jobs evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            codeql_analyze_check_id="$(jq -r '.analyzeCheckId' \
              <<<"${codeql_observation}")"
            if ! codeql_analyze_check="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs/${codeql_analyze_check_id}")"; then
              sleep 5
              continue
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              --argjson analyzeCheck "${codeql_analyze_check}" \
              '{run: $run, jobs: $jobs, analyzeCheck: $analyzeCheck}' | \
              validate_codeql_observation analyze-check \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL analyze check evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            if ! codeql_check_pages="$(fetch_paginated_pages --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
              -f check_name=CodeQL -f filter=all -f per_page=100)"; then
              sleep 5
              continue
            fi
            if ! codeql_checks="$(paginated_object_collection check_runs \
              <<<"${codeql_check_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection check-runs <<<"${codeql_checks}"; then
              fail_attestation "Release PR CodeQL check runs evidence is malformed"
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              --argjson analyzeCheck "${codeql_analyze_check}" \
              --argjson checkRuns "${codeql_checks}" \
              '{run: $run, jobs: $jobs, analyzeCheck: $analyzeCheck,
                checkRuns: $checkRuns}' | \
              validate_codeql_observation check-runs \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL check runs evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            codeql_check_suite_id="$(jq -r '.checkSuiteId' \
              <<<"${codeql_observation}")"
            if ! codeql_check_suite="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-suites/${codeql_check_suite_id}")"; then
              sleep 5
              continue
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              --argjson analyzeCheck "${codeql_analyze_check}" \
              --argjson checkRuns "${codeql_checks}" \
              --argjson checkSuite "${codeql_check_suite}" \
              '{run: $run, jobs: $jobs, analyzeCheck: $analyzeCheck,
                checkRuns: $checkRuns,
                checkSuite: $checkSuite}' | \
              validate_codeql_observation check-suite \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL check suite evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            if ! codeql_analysis_pages="$(fetch_paginated_pages --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses" \
              -f ref=refs/heads/changeset-release/main -f tool_name=CodeQL -f per_page=100)"; then
              sleep 5
              continue
            fi
            if ! codeql_analyses="$(paginated_array_collection \
              <<<"${codeql_analysis_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection analyses <<<"${codeql_analyses}"; then
              fail_attestation "Release PR CodeQL analyses evidence is malformed"
            fi
            : > "${codeql_evidence_error}"
            if ! codeql_observation="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              --argjson analyses "${codeql_analyses}" \
              '{run: $run, jobs: $jobs, analyses: $analyses}' | \
              validate_codeql_observation analyses \
              2>"${codeql_evidence_error}")"; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Release PR CodeQL analyses evidence is malformed"
            fi
            if [[ "$(jq -r '.state' <<<"${codeql_observation}")" == "pending" ]]; then
              sleep 5
              continue
            fi
            : > "${codeql_evidence_error}"
            if codeql_receipt="$(jq -n \
              --argjson run "${codeql_run}" \
              --argjson jobs "${codeql_jobs}" \
              --argjson analyzeCheck "${codeql_analyze_check}" \
              --argjson analyses "${codeql_analyses}" \
              --argjson checkRuns "${codeql_checks}" \
              --argjson checkSuite "${codeql_check_suite}" \
              --slurpfile pullRequest "${pull_request_json}" \
              '{evidence: {run: $run, jobs: $jobs, analyzeCheck: $analyzeCheck,
                analyses: $analyses,
                checkRuns: $checkRuns, checkSuite: $checkSuite,
                pullRequest: $pullRequest[0]}}' | \
              node scripts/check-release-codeql-evidence.mjs \
                --api "${GITHUB_API_URL}" \
                --repository "${GITHUB_REPOSITORY}" \
                --server "${GITHUB_SERVER_URL}" \
                --run "${codeql_run_id}" \
                --pr "${RELEASE_PULL_REQUEST}" \
                --branch changeset-release/main \
                --base "${base_sha}" \
                --head "${head_sha}" 2>"${codeql_evidence_error}")"; then
              break
            fi
            cat "${codeql_evidence_error}" >&2
            fail_attestation "Release PR exact CodeQL evidence is malformed"
          done
          if [[ -z "${codeql_receipt}" ]]; then
            cat "${codeql_evidence_error}" >&2
            fail_attestation "Release PR exact CodeQL evidence was not verified"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${final_pull_request_json}"
          final_current_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          final_head_sha="$(jq -r '.head.sha' "${final_pull_request_json}")"
          final_base_sha="$(jq -r '.base.sha' "${final_pull_request_json}")"
          if [[ ! "${final_current_main_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${final_head_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${final_base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            fail_attestation "Final release PR revision tuple is malformed"
          fi
          git fetch --no-tags origin "${final_current_main_sha}" "${final_head_sha}"
          if ! jq -n \
            --arg currentMainSha "${final_current_main_sha}" \
            --arg expectedBaseSha "${EXPECTED_RELEASE_BASE_SHA}" \
            --arg expectedHeadSha "${head_sha}" \
            --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
            --slurpfile pullRequest "${final_pull_request_json}" \
            '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
            node scripts/check-release-pr-freshness.mjs \
              --processed-main "${PROCESSED_MAIN_SHA}"; then
            fail_attestation "Release PR changed or main advanced during CI"
          fi

          codeql_check_suite_id="$(jq -r '.checkSuiteId' <<<"${codeql_receipt}")"
          codeql_analyze_check_id="$(jq -r '.analyzeCheckId' <<<"${codeql_receipt}")"
          observed_codeql_run="${codeql_run}"
          observed_codeql_jobs="${codeql_jobs}"
          observed_codeql_analyze_check="${codeql_analyze_check}"
          observed_codeql_checks="${codeql_checks}"
          observed_codeql_check_suite="${codeql_check_suite}"
          observed_codeql_analyses="${codeql_analyses}"
          observed_pull_request="$(< "${final_pull_request_json}")"

          validate_final_codeql_snapshot() {
            : > "${codeql_evidence_error}"
            jq -n \
              --argjson run "${observed_codeql_run}" \
              --argjson jobs "${observed_codeql_jobs}" \
              --argjson analyzeCheck "${observed_codeql_analyze_check}" \
              --argjson analyses "${observed_codeql_analyses}" \
              --argjson checkRuns "${observed_codeql_checks}" \
              --argjson checkSuite "${observed_codeql_check_suite}" \
              --argjson pullRequest "${observed_pull_request}" \
              --argjson priorReceipt "${codeql_receipt}" \
              '{evidence: {run: $run, jobs: $jobs, analyzeCheck: $analyzeCheck,
                analyses: $analyses, checkRuns: $checkRuns, checkSuite: $checkSuite,
                pullRequest: $pullRequest, postRun: $run,
                postPullRequest: $pullRequest}, priorReceipt: $priorReceipt}' | \
              node scripts/check-release-codeql-evidence.mjs \
                --api "${GITHUB_API_URL}" \
                --repository "${GITHUB_REPOSITORY}" \
                --server "${GITHUB_SERVER_URL}" \
                --run "${codeql_run_id}" \
                --pr "${RELEASE_PULL_REQUEST}" \
                --branch changeset-release/main \
                --base "${base_sha}" \
                --head "${head_sha}" >/dev/null 2>"${codeql_evidence_error}"
          }

          require_final_codeql_snapshot() {
            if ! validate_final_codeql_snapshot; then
              cat "${codeql_evidence_error}" >&2
              fail_attestation "Final release PR CodeQL evidence changed identity"
            fi
          }

          require_final_release_pr_snapshot() {
            local observed_main_sha="$1"
            if ! jq -n \
              --arg currentMainSha "${observed_main_sha}" \
              --arg expectedBaseSha "${EXPECTED_RELEASE_BASE_SHA}" \
              --arg expectedHeadSha "${head_sha}" \
              --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
              --argjson pullRequest "${observed_pull_request}" \
              '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha,
                expectedHeadSha: $expectedHeadSha,
                expectedPullRequestNumber: $expectedPullRequestNumber,
                pullRequest: $pullRequest}' | \
              node scripts/check-release-pr-freshness.mjs \
                --processed-main "${PROCESSED_MAIN_SHA}"; then
              fail_attestation "Release PR or main changed during final evidence collection"
            fi
          }

          final_run_verified=0
          final_verification_deadline=$((SECONDS + 60))
          while (( SECONDS < final_verification_deadline )); do
            if ! final_bound_run="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${bound_run_id}")"; then
              sleep 5
              continue
            fi
            read -r final_run_id final_run_path final_run_event \
              final_run_head_branch final_run_head_sha final_run_attempt \
              final_run_url final_run_head_repository \
              final_run_pull_request_count final_run_pull_request_number \
              final_run_pull_request_head_ref final_run_pull_request_head_sha \
              final_run_pull_request_base_ref final_run_pull_request_base_sha \
              final_run_status \
              final_run_conclusion < <(jq -r \
              '[.id, .path, .event, .head_branch, .head_sha, .run_attempt,
                .html_url, .head_repository.full_name, (.pull_requests | length),
                (.pull_requests[0].number // "missing"), (.pull_requests[0].head.ref // "missing"),
                (.pull_requests[0].head.sha // "missing"), (.pull_requests[0].base.ref // "missing"),
                (.pull_requests[0].base.sha // "missing"), .status, .conclusion // ""] | @tsv' \
              <<<"${final_bound_run}")
            if [[ "${final_run_id}" != "${bound_run_id}" || \
              "${final_run_path}" != ".github/workflows/ci.yml" || \
              "${final_run_event}" != "${bound_run_event}" || \
              "${final_run_head_branch}" != "changeset-release/main" || \
              "${final_run_head_sha}" != "${head_sha}" || \
              "${final_run_attempt}" != "1" || \
              "${final_run_url}" != "${expected_run_url}" || \
              "${final_run_head_repository}" != "${GITHUB_REPOSITORY}" ]]; then
              fail_attestation "Final release PR CI evidence changed identity"
            fi
            if [[ "${final_run_event}" == "pull_request" || \
              "${final_run_pull_request_count}" != "0" ]]; then
              if [[ "${final_run_pull_request_count}" != "1" || \
                "${final_run_pull_request_number}" != "${RELEASE_PULL_REQUEST}" || \
                "${final_run_pull_request_head_ref}" != "changeset-release/main" || \
                "${final_run_pull_request_head_sha}" != "${head_sha}" || \
                "${final_run_pull_request_base_ref}" != "main" || \
                "${final_run_pull_request_base_sha}" != "${base_sha}" ]]; then
                fail_attestation "Final release PR CI has unexpected pull request provenance"
              fi
            fi
            if [[ "${final_run_status}" != "completed" ]]; then
              sleep 5
              continue
            fi
            if [[ "${final_run_conclusion}" != "success" ]]; then
              fail_attestation "Final release PR CI did not succeed"
            fi
            if ! final_codeql_run="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}")"; then
              sleep 5
              continue
            fi
            observed_codeql_run="${final_codeql_run}"
            require_final_codeql_snapshot
            if ! final_codeql_job_pages="$(fetch_paginated_pages \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}/attempts/1/jobs?per_page=100")"; then
              sleep 5
              continue
            fi
            if ! final_codeql_jobs="$(paginated_object_collection jobs \
              <<<"${final_codeql_job_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection jobs <<<"${final_codeql_jobs}"; then
              fail_attestation "Release PR CodeQL jobs evidence is malformed"
            fi
            observed_codeql_jobs="${final_codeql_jobs}"
            require_final_codeql_snapshot
            if ! final_codeql_analyze_check="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-runs/${codeql_analyze_check_id}")"; then
              sleep 5
              continue
            fi
            observed_codeql_analyze_check="${final_codeql_analyze_check}"
            require_final_codeql_snapshot
            if ! final_codeql_check_pages="$(fetch_paginated_pages --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
              -f check_name=CodeQL -f filter=all -f per_page=100)"; then
              sleep 5
              continue
            fi
            if ! final_codeql_checks="$(paginated_object_collection check_runs \
              <<<"${final_codeql_check_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection check-runs <<<"${final_codeql_checks}"; then
              fail_attestation "Release PR CodeQL check runs evidence is malformed"
            fi
            observed_codeql_checks="${final_codeql_checks}"
            require_final_codeql_snapshot
            if ! final_codeql_check_suite="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/check-suites/${codeql_check_suite_id}")"; then
              sleep 5
              continue
            fi
            observed_codeql_check_suite="${final_codeql_check_suite}"
            require_final_codeql_snapshot
            if ! final_codeql_analysis_pages="$(fetch_paginated_pages --method GET \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses" \
              -f ref=refs/heads/changeset-release/main -f tool_name=CodeQL -f per_page=100)"; then
              sleep 5
              continue
            fi
            if ! final_codeql_analyses="$(paginated_array_collection \
              <<<"${final_codeql_analysis_pages}")"; then
              fail_attestation "Release PR CodeQL pagination evidence is malformed"
            fi
            if ! validate_codeql_collection analyses <<<"${final_codeql_analyses}"; then
              fail_attestation "Release PR CodeQL analyses evidence is malformed"
            fi
            observed_codeql_analyses="${final_codeql_analyses}"
            require_final_codeql_snapshot
            if ! post_codeql_run="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}")"; then
              sleep 5
              continue
            fi
            observed_codeql_run="${post_codeql_run}"
            require_final_codeql_snapshot
            if ! post_pull_request="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}")"; then
              sleep 5
              continue
            fi
            observed_pull_request="${post_pull_request}"
            require_final_codeql_snapshot
            require_final_release_pr_snapshot "${final_current_main_sha}"
            if ! post_current_main_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"; then
              sleep 5
              continue
            fi
            require_final_release_pr_snapshot "${post_current_main_sha}"
            final_run_verified=1
            break
          done
          if (( final_run_verified != 1 )); then
            cat "${codeql_evidence_error}" >&2
            fail_attestation "Final release PR CI could not be verified"
          fi

          analyze_target_url="$(jq -er '.html_url | select(type == "string" and length > 0)' \
            <<<"${observed_codeql_analyze_check}")"

          for index in "${!ci_contexts[@]}"; do
            post_status "${ci_contexts[index]}" success \
              "Release PR ${ci_contexts[index]}: ${conclusions[index]}" \
              "${target_urls[index]}"
          done
          post_status analyze success "Release PR analyze: success" \
            "${analyze_target_url}"
          status_finalized=1
