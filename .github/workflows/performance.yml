      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Bind exact physical tools and ephemeral fixture identity
        env:
          PNPM_ENTRY: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          test "$(node --version)" = v26.11.1
          test "$(bun --version)" = 1.4.3
          test "$(pnpm --pm-on-fail=ignore --version)" = 11.20.0
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\nAGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE=%s\nAGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT=%s\n' "$(node -p 'process.execPath')" "$(realpath "$(command -v bun)")" "$PNPM_ENTRY" >> "$GITHUB_ENV"
          printf 'Node=%s\nBun=%s\npnpm=%s\n' "$(node --version)" "$(bun --version)" "$(pnpm --pm-on-fail=ignore --version)" > "$EVIDENCE/tools.txt"
          printf 'NODE_DISABLE_COMPILE_CACHE=1\n' >> "$GITHUB_ENV"
          git config --global user.name iliya
          git config --global user.email iliyazelenkog@gmail.com
      - name: Normal frozen Bun installation
        id: install
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          printf '%s\n' bun tools/dev.mts install > "$EVIDENCE/install.argv.txt"
          if bun tools/dev.mts install > "$EVIDENCE/install.merged.log" 2>&1; then code=0; else code=$?; fi
          cat "$EVIDENCE/install.merged.log"
          printf '%s\n' "$code" > "$EVIDENCE/install.exit.txt"
          exit "$code"
      - name: Normal repository build
        id: build
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          printf '%s\n' bun tools/dev.mts build > "$EVIDENCE/build.argv.txt"
          if bun tools/dev.mts build > "$EVIDENCE/build.merged.log" 2>&1; then code=0; else code=$?; fi
