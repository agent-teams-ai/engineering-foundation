schemaVersion: 1
workflowDirectory: .github/workflows
dependencyReviewWorkflow: .github/workflows/dependency-review.yml
sbomWorkflow: .github/workflows/ci.yml
privilegedJobs:
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-refresh
    permissions:
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-interaction.yml
    jobId: interaction
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/release.yml
    jobId: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
  - workflowPath: .github/workflows/review-gate.yml
    jobId: review-gate
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
  - workflowPath: .github/workflows/release.yml
    jobId: attest-release-pr
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
publishablePackageManifests:
  - packages/engineering-foundation/package.json
