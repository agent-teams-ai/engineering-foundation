name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.label.name == 'ci:full'
      && format('Full CI #{0} @{1} on {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)
      || format('CI {0} run {1}', github.event_name, github.run_id) }}

on:
  pull_request:
    types: [labeled]
  merge_group: {}
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && (github.event.label.name == 'ci:full' && format('foundation-pr-{0}', github.event.pull_request.number)
            || format('foundation-ci-unrequested-{0}', github.run_id))
        || format('foundation-ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  shadow-classifier:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    name: advisory-shadow-classifier
    needs: dependency-review
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Observe conservative CI classification
        run: node scripts/ci-shadow-classifier.mjs --github-event

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          vulnerability-check: true
          warn-only: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: engineering-foundation-sbom.spdx.json
          upload-release-assets: false

  node26-compatibility:
    name: node-compatibility (${{ matrix.lane }})
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: node24-production-default
            node-version: "24.21.0"
          - lane: node26-compatibility
            node-version: "26.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Require a clean compatibility install
        run: test ! -d node_modules
      - run: pnpm install --frozen-lockfile --ignore-scripts --engine-strict
      - run: pnpm dependencies:peers:check
      - run: pnpm rebuild
      - name: Qualify publishable packages in a fresh strict-engine consumer
        run: pnpm node-compatibility:qualification
      - name: Run focused observable compatibility regressions
        run: node --test --test-concurrency=1 tests/node-test-execution.test.mjs tests/docs-protocol-current-policy.test.mjs tests/registry-install-policy.test.mjs packages/docs-protocol/tests/qualification.test.mjs

  linux-static:
    name: linux-static
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate package Changeset coverage
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'changeset-release/main') }}
        env:
          FOUNDATION_CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm changeset:coverage
      - run: pnpm rebuild
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run Foundation check
        id: foundation-check
        run: |
          set -o pipefail
          node packages/engineering-foundation/dist/cli.js check --consumer . --format json | tee "$RUNNER_TEMP/foundation-check.json"
        env:
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Show SDK public API report
        if: ${{ always() && steps.foundation-check.outcome != 'skipped' }}
        run: node scripts/sdk-api-ci-summary.mjs "$RUNNER_TEMP/foundation-check.json"
      - run: pnpm release-owned-files:check
        env:
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      - run: pnpm architecture:patterns
      - run: pnpm architecture:patterns:test
      - run: pnpm nx:graph:check
      - run: pnpm security:workflows
      - run: pnpm dead-code:check
      - run: pnpm parser-spike:check
  linux-tests:
    name: linux-tests-${{ matrix.pair.first }}-${{ matrix.pair.second }}
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { first: "1", second: "2" }
          - { first: "3", second: "4" }
          - { first: "5", second: "6" }
          - { first: "7", second: "8" }
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
      FIRST_SHARD: ${{ matrix.pair.first }}
      SECOND_SHARD: ${{ matrix.pair.second }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: b
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false, working-directory: a }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.pair.second == '4' }}
        with: { node-version: "26.10.0" }
      - name: Retain pinned Node 26 test source
        if: ${{ matrix.pair.second == '4' }}
        run: printf 'MANAGED_TEST_NODE26_SOURCE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: a/.node-version
          cache: pnpm
          cache-dependency-path: a/pnpm-lock.yaml
      - name: Build both isolated producers
        run: node a/scripts/run-ci-test-pair.mts build "$FIRST_SHARD" "$SECOND_SHARD"
      - name: Provision public pinned managed test copies
        if: ${{ matrix.pair.second == '4' }}
        working-directory: b
        env:
          RUNNER_TEMP: ${{ runner.temp }}/producer-4
          TMPDIR: ${{ runner.temp }}/producer-4
        run: node scripts/provision-managed-test-tools.mjs
      - name: Run both isolated test shards
        id: test-pair
        run: node a/scripts/run-ci-test-pair.mts test "$FIRST_SHARD" "$SECOND_SHARD"
      - name: Upload first raw coverage evidence
        if: ${{ always() && steps.test-pair.outputs.first-status == '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence-${{ github.sha }}-shard-${{ matrix.pair.first }}
          path: a/.coverage-evidence/shard-${{ matrix.pair.first }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
      - name: Upload first advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-linux-test-${{ matrix.pair.first }}
          path: ${{ runner.temp }}/producer-${{ matrix.pair.first }}/test-timing/linux-test-${{ matrix.pair.first }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload second raw coverage evidence
        if: ${{ always() && steps.test-pair.outputs.second-status == '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence-${{ github.sha }}-shard-${{ matrix.pair.second }}
          path: b/.coverage-evidence/shard-${{ matrix.pair.second }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
      - name: Upload second advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-linux-test-${{ matrix.pair.second }}
          path: ${{ runner.temp }}/producer-${{ matrix.pair.second }}/test-timing/linux-test-${{ matrix.pair.second }}
          if-no-files-found: warn
          retention-days: 14

  linux-coverage:
    name: linux-coverage
    needs:
      - dependency-review
      - linux-tests
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      - name: Download exact-head shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-evidence-${{ github.sha }}-shard-*
          path: .coverage-evidence/downloaded
          merge-multiple: false
      - name: Validate, merge once, and enforce coverage thresholds
        run: pnpm test:coverage:evidence:built -- --input .coverage-evidence/downloaded --head-sha "${{ github.sha }}"

  linux-package:
    name: linux-package
    # Give the long test lanes first access to shared hosted runner capacity.
    needs: [dependency-review, linux-static]
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      - run: pnpm package:check:built
      - name: Verify approved bootstrap writer evidence
        run: node scripts/npm-package-bootstrap-local-evidence.mjs --output "${RUNNER_TEMP}/npm-package-bootstrap-writer-evidence"
      - name: Retain bootstrap writer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-bootstrap-writer-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package-bootstrap-writer-evidence
          if-no-files-found: error
      - run: pnpm buf-qualification:e2e:built

  linux-registry:
    name: linux-registry
    # Independent qualification can start as soon as Dependency Review succeeds.
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry-install-e2e

  linux-bootstrap-evidence:
    name: linux-bootstrap-evidence
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      - name: Prepare retained candidate bootstrap evidence
        run: node scripts/npm-package-bootstrap-candidate-evidence.mjs --output "${RUNNER_TEMP}/npm-package-bootstrap-candidate-evidence"
      - name: Upload candidate bootstrap evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-bootstrap-candidate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package-bootstrap-candidate-evidence
          if-no-files-found: error

  linux-published:
    name: linux-published
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm published-compatibility:e2e
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci:full') && 'check' || 'ci-not-requested-check' }}
    needs:
      - dependency-review
      - node26-compatibility
      - linux-static
      - linux-tests
      - linux-coverage
      - linux-package
      - linux-registry
      - linux-bootstrap-evidence
      - linux-published
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'ci:full') }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Linux lane
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030 # post-v1.2.2 injection fix, exact reviewed commit
        with:
          jobs: ${{ toJSON(needs) }}

  windows-static:
    name: windows-static
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Use runner temporary directory
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "RUNNER_TEMP must be set"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP")
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - name: Compile Windows managed-process helpers
        shell: powershell
        run: |
          $tokens = $null
          $syntaxErrors = $null
          $scriptPath = Resolve-Path "packages/engineering-foundation/assets/windows-managed-process/bootstrap.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath, [ref]$tokens, [ref]$syntaxErrors)
          if ($syntaxErrors.Count -ne 0) {
            throw ($syntaxErrors | Out-String)
          }
          Add-Type -Path "packages/engineering-foundation/assets/windows-managed-process/WindowsManagedProcess.cs"
      - run: pnpm check:fast
      - run: pnpm parser-spike:check

  windows-test-a:
    name: windows-test-a
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Use runner temporary directory
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "RUNNER_TEMP must be set"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP")
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      # Windows partitions retain the complete canonical inventory in five isolated
      # jobs. Serial execution inside each job preserves fixture ownership.
      - name: Run isolated Windows test partition
        run: pnpm test:shard:built -- --windows-lane a --timing-output "$env:RUNNER_TEMP/test-timing/windows-test-a"
      - name: Upload advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-windows-test-a
          path: ${{ runner.temp }}/test-timing/windows-test-a
          if-no-files-found: warn
          retention-days: 14

  windows-test-b:
    name: windows-test-b
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Use runner temporary directory
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "RUNNER_TEMP must be set"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP")
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      - run: pnpm test:shard:built -- --windows-lane b --timing-output "$env:RUNNER_TEMP/test-timing/windows-test-b"
      - name: Upload advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-windows-test-b
          path: ${{ runner.temp }}/test-timing/windows-test-b
          if-no-files-found: warn
          retention-days: 14

  windows-test-c:
    name: windows-test-c
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:full' }}
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Use runner temporary directory
        shell: pwsh
