name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: resolve-pr
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || {
            echo "pr_number must be a positive integer" >&2
            exit 1
          }
          read -r state head_sha < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            --jq '[.state, .head.sha] | @tsv')
          [[ "${state}" == "open" ]] || {
            echo "Review target must be an open pull request." >&2
            exit 1
          }
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Review target has an invalid head SHA." >&2
            exit 1
          }
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

  review:
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: agent-teams-ai/.github/.github/workflows/reviewrouter-reusable.yml@0cb2fc11d001cd93f847199285f796da188f7ad8
    with:
      pr_number: ${{ needs.resolve.outputs.number }}
      review_drafts: ${{ vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true' }}
      timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
      max_changed_lines: ${{ fromJSON(vars.REVIEW_ROUTER_MAX_CHANGED_LINES || '250000') }}
      codex_model: ${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.6-sol' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}

  required-review:
    name: ReviewRouter
    needs: [resolve, review]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot') }}
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish dispatched review result on the reviewed revision
        if: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          REVIEWED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="Independent review failed"
          current_head_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq .head.sha)"
          if [[ "${current_head_sha}" != "${REVIEWED_HEAD_SHA}" ]]; then
            description="Review target changed during attestation"
          elif [[ "${RESOLVE_RESULT}" == "success" && "${REVIEW_RESULT}" == "success" ]]; then
            state=success
            description="Independent review passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${REVIEWED_HEAD_SHA}" \
            -f state="${state}" \
            -f context="review / review" \
            -f description="${description}" \
            -f target_url="${REVIEW_RUN_URL}" >/dev/null

      - name: Require successful independent review
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail
          [[ "${RESOLVE_RESULT}" == "success" && "${REVIEW_RESULT}" == "success" ]]

  codex-refresh:
    name: codex-refresh
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: ReviewRouter Codex OAuth refresh
        uses: 777genius/review-router@626739854b5c67d94b3f0118738c106b4a232c41
        with:
          mode: codex-oauth-refresh
          api-url: "https://api.reviewrouter.site"
          provider-instance-id: "codex-rotating:1316243988"
          workflow-schema-version: "2"
          auth-json: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
