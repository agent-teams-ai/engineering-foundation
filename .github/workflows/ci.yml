name: Foundation Windows Node26 TEST
# Disposable TEST branch only: replaces the registered CI path so it can be dispatched; never merge.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: 51b10492a516b73fe7b182d47796a6dd55ed5a3e

jobs:
  windows-node26:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: 51b10492a516b73fe7b182d47796a6dd55ed5a3e, persist-credentials: false, fetch-depth: 1 }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "26.10.0" }
      - name: Use runner temporary directory
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw "RUNNER_TEMP must be set" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP")
      - name: Verify and record tool and source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'evidence'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $node = (Get-Command node | Select-Object -First 1).Source
          $pnpm = (Get-Command pnpm | Select-Object -First 1).Source
          $facts = [ordered]@{
            expectedHead = $env:EXPECTED_HEAD; head = (git rev-parse HEAD); tree = (git rev-parse 'HEAD^{tree}')
            nodeVersion = (node -p 'process.versions.node'); platform = (node -p 'process.platform')
            pnpmVersion = (pnpm --version); nodePath = $node; pnpmPath = $pnpm
            nodeSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $node).Hash
            pnpmSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $pnpm).Hash
          }
          $facts | ConvertTo-Json | Tee-Object -FilePath (Join-Path $dir 'identity.json')
          if ($facts.head -ne $env:EXPECTED_HEAD) { throw "HEAD $($facts.head) is not the expected source" }
          if ($facts.nodeVersion -ne '26.10.0') { throw "Node $($facts.nodeVersion), expected 26.10.0" }
          if ($facts.pnpmVersion -ne '11.20.0') { throw "pnpm $($facts.pnpmVersion), expected 11.20.0" }
          if ($facts.platform -ne 'win32') { throw "platform $($facts.platform), expected win32" }
      - name: Install and build
        shell: pwsh
        run: |
          foreach ($step in @(@('install', '--frozen-lockfile', '--ignore-scripts', '--engine-strict'), @('rebuild'), @('build'))) {
            & pnpm @step
            if ($LASTEXITCODE -ne 0) { throw "pnpm $($step -join ' ') exited with $LASTEXITCODE" }
          }
      - name: Selected tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'evidence/selected-tests.log'
          & node scripts/run-selected-tests.mjs tests/node-test-execution.test.mjs tests/process-failure-reporting.test.mts tests/package-boundary.test.mjs 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "selected tests exited with $code" }
          $summary = 'Mandatory Node tests: 19 required identities completed or exactly excepted'
          if (@(Select-String -LiteralPath $log -Pattern "^$([regex]::Escape($summary))$").Count -ne 1) {
            throw "exact success summary missing: $summary"
          }
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-node26-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
