name: Native context canceled diagnostic
run-name: Native context diagnostic @${{ github.sha }} (ten fixed iterations)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-context-canceled:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize job-owned diagnostic retention
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/native-context-canceled-linux/tmp"
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}/native-context-canceled-linux/tmp" >> "$GITHUB_ENV"
          printf 'head=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "${RUNNER_TEMP}/native-context-canceled-linux/workflow-source.txt"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "26.11.1" }
      - name: Bind physical runtime executables
        shell: bash
        env:
          SELECTED_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          set -Eeuo pipefail
          physical_node="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          physical_bun="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$SELECTED_BUN_EXECUTABLE")"
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\n' "$physical_node" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE=%s\n' "$physical_bun" >> "$GITHUB_ENV"
      - name: Canonical install
        shell: bash
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts install 2>&1 | tee "${RUNNER_TEMP}/native-context-canceled-linux/install.log"
      - name: Canonical build
        shell: bash
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts build 2>&1 | tee "${RUNNER_TEMP}/native-context-canceled-linux/build.log"
      - name: Strictly typecheck the one diagnostic TypeScript source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./node_modules/typescript/package.json").version')" = "7.0.2"
          node node_modules/typescript/bin/tsc --ignoreConfig --strict --noEmit --module NodeNext --moduleResolution NodeNext --target ES2024 --skipLibCheck --types node scripts/diagnose-native-context.ts 2>&1 | tee "${RUNNER_TEMP}/native-context-canceled-linux/runner-typecheck.log"
      - name: Capture ten fixed exact-case iterations (diagnostic only)
        shell: bash
        run: |
          set -Eeuo pipefail
          "${AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE}" scripts/diagnose-native-context.ts 2>&1 | tee "${RUNNER_TEMP}/native-context-canceled-linux/runner.log"
      - name: Retain all raw diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-context-canceled-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-context-canceled-linux
          if-no-files-found: error
          retention-days: 14
