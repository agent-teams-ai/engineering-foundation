schemaVersion: 1
workflowDirectory: .github/workflows
dependencyReview:
  workflowPath: .github/workflows/ci.yml
  jobId: dependency-review
  baseRef: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
  headRef: ${{ github.event.pull_request.head.sha || github.sha }}
  failOnSeverity: moderate
sbomWorkflow: .github/workflows/ci.yml
allowedContainerImages: []
allowedPullRequestTargetWorkflows:
  - .github/workflows/reviewrouter-codex.yml
allowedUses:
  - uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@8a0a31ae1d92c89466c8a939272a1e333e88c5a0
    transitiveUses: []
  - uses: 777genius/review-router@8a0a31ae1d92c89466c8a939272a1e333e88c5a0
    transitiveUses: []
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    transitiveUses: []
  - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    transitiveUses: []
  - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
    transitiveUses: []
  - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
    transitiveUses: []
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    transitiveUses: []
  - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
    transitiveUses: []
  - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
    transitiveUses: []
  - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
    transitiveUses: []
  - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
    transitiveUses: []
  - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
    transitiveUses: []
  - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
    transitiveUses: []
  - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
    transitiveUses: []
  - uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
    transitiveUses: []
privilegedJobs:
  - workflowPath: .github/workflows/docs-protocol-bootstrap.yml
    jobId: bootstrap
    permissions:
      contents: read
      id-token: write
  - workflowPath: .github/workflows/docs-protocol-bootstrap.yml
    jobId: reconcile-github
    permissions:
      contents: write
  - workflowPath: .github/workflows/codeql.yml
    jobId: analyze
    permissions:
      contents: read
      security-events: write
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-refresh
    permissions:
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-interaction.yml
    jobId: interaction
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/release.yml
    jobId: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
  - workflowPath: .github/workflows/review-gate.yml
    jobId: review-gate
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
  - workflowPath: .github/workflows/release.yml
    jobId: attest-release-pr
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
publishablePackageManifests:
  - packages/engineering-foundation/package.json
  - packages/docs-protocol/package.json
