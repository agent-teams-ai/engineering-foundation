id: foundation-no-ambient-timers
language: TypeScript
severity: error
message: Foundation source must not schedule ambient timers.
note: Model timers as commands or use a scheduler port.
files:
  - "packages/*/src/**/*.ts"
ignores:
  - "packages/docs-protocol/src/qualification/crash-driver.ts"
rule:
  any:
    - pattern: setTimeout($$$ARGS)
    - pattern: setInterval($$$ARGS)
    - pattern: setImmediate($$$ARGS)
