name: Prepare signed ci-input-proof RC

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Reviewed exact protected-main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-input-proof-first-rc
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'agent-teams-ai/engineering-foundation' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare isolated RC archive
        id: artifact
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node scripts/prepare-ci-input-proof-rc.mts "${RUNNER_TEMP}/ci-input-proof-rc" "${EXPECTED_COMMIT}"
      - name: Sign exact npm subject and archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.artifact.outputs.subject }}
          subject-digest: sha512:${{ steps.artifact.outputs.sha512 }}
      - name: Retain signed bundle beside archive
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" "${RUNNER_TEMP}/ci-input-proof-rc/provenance.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-input-proof-rc-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-input-proof-rc/archive/*.tgz
            ${{ runner.temp }}/ci-input-proof-rc/artifact.json
            ${{ runner.temp }}/ci-input-proof-rc/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14
