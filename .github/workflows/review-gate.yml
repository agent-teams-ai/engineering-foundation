name: Review Gate

on:
  status:
  repository_dispatch:
    types: [review-gate-recover]

permissions: {}

jobs:
  review-gate:
    name: publish-review-gate
    if: ${{ (github.event_name == 'status' && github.event.context == 'ReviewRouter' && github.event.state == 'success' && github.event.sender.id == 281702430 && github.event.sender.type == 'Bot') || github.event.action == 'review-gate-recover' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish exact-head ReviewGate from App evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_RUN_ID: ${{ github.event.client_payload.review_run_id }}
          REVIEW_STATUS_CONTEXT: ${{ github.event.context }}
          REVIEW_STATUS_SENDER_ID: ${{ github.event.sender.id }}
          REVIEW_STATUS_SENDER_TYPE: ${{ github.event.sender.type }}
          REVIEW_STATUS_SHA: ${{ github.event.sha }}
          REVIEW_STATUS_STATE: ${{ github.event.state }}
          REVIEW_STATUS_TARGET_URL: ${{ github.event.target_url }}
          REVIEWROUTER_APP_BOT_ID: "281702430"
        run: |
          set -euo pipefail

          review_run_id="${REVIEW_RUN_ID}"
          if [[ "${GITHUB_EVENT_NAME}" == "status" ]]; then
            if [[ "${REVIEW_STATUS_CONTEXT}" != "ReviewRouter" || \
              "${REVIEW_STATUS_STATE}" != "success" || \
              "${REVIEW_STATUS_SENDER_ID}" != "${REVIEWROUTER_APP_BOT_ID}" || \
              "${REVIEW_STATUS_SENDER_TYPE}" != "Bot" ]]; then
              echo "Status event is not an App-owned successful ReviewRouter status." >&2
              exit 1
            fi
            expected_run_url_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"
            if [[ "${REVIEW_STATUS_TARGET_URL}" != "${expected_run_url_prefix}"* ]]; then
              echo "ReviewRouter status target is not a repository Actions run." >&2
              exit 1
            fi
            review_run_id="${REVIEW_STATUS_TARGET_URL#"${expected_run_url_prefix}"}"
          fi

          if [[ ! "${review_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ReviewRouter run ID must be a positive integer." >&2
            exit 1
          fi

          run_json=""
          for attempt in {1..12}; do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${review_run_id}")"
            if [[ "$(jq -r '.status // "missing"' <<<"${run_json}")" == "completed" ]]; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "ReviewRouter run did not complete within the bounded wait." >&2
              exit 1
            fi
            sleep 5
          done

          read -r run_status run_conclusion run_event run_head_sha run_path run_head_repository run_url pr_count pr_number < <(jq -r \
            '[.status, .conclusion, .event, .head_sha, .path, .head_repository.full_name, .html_url, (.pull_requests | length), (.pull_requests[0].number // "")] | @tsv' \
            <<<"${run_json}")
          if [[ "${run_status}" != "completed" || \
            "${run_event}" != "pull_request_target" || \
            "${run_path}" != ".github/workflows/reviewrouter-codex.yml" || \
            "${run_head_repository}" != "${GITHUB_REPOSITORY}" || \
            "${pr_count}" != "1" || ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ReviewRouter run is not bound to one same-repository pull request." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "status" && "${run_head_sha}" != "${REVIEW_STATUS_SHA}" ]]; then
            echo "ReviewRouter status SHA does not match its Actions run." >&2
            exit 1
          fi

          read -r pr_state current_head_sha current_head_repository < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          if [[ "${pr_state}" != "open" || "${current_head_sha}" != "${run_head_sha}" || \
            "${current_head_repository}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "ReviewRouter run is stale or no longer bound to the open pull request head."
            exit 0
          fi

          review_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/statuses/${run_head_sha}" | \
            jq -r --arg run_url "${run_url}" --argjson app_bot_id "${REVIEWROUTER_APP_BOT_ID}" \
              '[.[] | select(.context == "ReviewRouter" and .target_url == $run_url and .creator.id == $app_bot_id and .creator.type == "Bot")] | sort_by(.id) | last | .state // "missing"')"
          gate_state=failure
          gate_description="App-owned ReviewRouter review failed"
          if [[ "${run_conclusion}" == "success" && "${review_state}" == "success" ]]; then
            gate_state=success
            gate_description="App-owned ReviewRouter review passed"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${run_head_sha}" \
            -f state="${gate_state}" \
            -f context="ReviewGate" \
            -f description="${gate_description}" \
            -f target_url="${run_url}" >/dev/null
          if [[ "${gate_state}" != "success" ]]; then
            echo "Published a failing ReviewGate on pull request #${pr_number}; the pull request head remains blocked."
          fi
          exit 0
