name: Disposable Windows baseline diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-baseline-diagnostic:
    name: disposable-windows-baseline-diagnostic
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify baseline observations and concurrent writers
        run: node --test --test-reporter=tap tests/documentation-architecture-decisions.test.mjs
