name: TEST finite Linux SIGKILL control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-kill-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEN3_LINUX_KILL_CONTROL_ONLY: one_term_resistant_owned_group_no_controller
      EXPECTED_TEST_REF: refs/heads/test/gen3-linux-kill-control-20261029
      KILL_INPUTS_SHA256: 991c6dedd817d75264daf8444e91a2b1a854560587b276cf1959190cf3a697c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packet
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.11.1
      - name: Exact finite Linux controls only
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/packet/test-gen3-linux-kill-control/linux-kill-control.ts"
      - name: Retain finite safe control facts
        if: ${{ always() && (steps.controls.outcome == 'success' || steps.controls.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finite-linux-kill-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-gen3-kill-control-${{ github.run_id }}-${{ github.run_attempt }}/retained
          if-no-files-found: warn
          retention-days: 14
