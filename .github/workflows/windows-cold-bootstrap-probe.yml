name: TEST cold Windows bootstrap probe
run-name: TEST cold Windows bootstrap probe @${{ github.sha }}
on:
  push:
    branches: ["chore/test-windows-cold-bootstrap-r21"]
permissions:
  contents: read
jobs:
  cold-bootstrap:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 2 }
      - name: Verify disposable diagnostic parent
        shell: pwsh
        run: |
          if ((git rev-parse HEAD^) -ne '373e4549104610633d65b043366f8b044cdf1528') { throw 'Unexpected source parent' }
          $paths = @(git diff --name-only HEAD^ HEAD)
          if (($paths -join ',') -ne '.github/workflows/windows-cold-bootstrap-probe.yml,scripts/windows-cold-bootstrap-probe.mts') { throw 'Unexpected diagnostic scope' }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild
      - run: pnpm build
      - name: Typecheck dedicated TEST probe
        run: node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --target ES2024 --types node scripts/windows-cold-bootstrap-probe.mts
      - name: Probe real cold PowerShell sessions under Job Object containment
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node scripts/windows-cold-bootstrap-probe.mts
