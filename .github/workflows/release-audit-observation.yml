name: Release audit observation

on:
  push:
    branches:
      - test/release-audit-observation-20261126

permissions:
  contents: read

concurrency:
  group: release-audit-observation-20261126
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.repository == 'agent-teams-ai/engineering-foundation' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact reviewed source parent and three-file diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnostic_base=bdfdf72c10994df939591b88a9dda5d7759cdc39
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git show -s --format=%P HEAD)" == "${diagnostic_base}" ]]
          [[ "$(git diff --name-only "${diagnostic_base}" HEAD)" == $'.github/workflows/release-audit-observation.yml\nscripts/release-audit-observation.ts\ntsconfig.ci-tooling.json' ]]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Provision the qualified npm release version
        shell: bash
        run: |
          set -Eeuo pipefail
          if npm install --global npm@11.19.0 --ignore-scripts >"${RUNNER_TEMP}/release-audit-npm-setup.stdout" 2>"${RUNNER_TEMP}/release-audit-npm-setup.stderr"; then
            node --input-type=module -e 'import { assertNpmVersion } from "./scripts/release-npm-command.ts"; assertNpmVersion();'
          else
            diagnostic_exit=$?
            printf 'Qualified npm provisioning failed (exit %s); raw output omitted.\n' "${diagnostic_exit}"
            exit "${diagnostic_exit}"
          fi
      - name: Install the actual Bun source worktree
        run: node tools/dev.mts install
      - name: Admit the repository TypeScript metadata before compiler initialization
        run: node --input-type=module -e 'import { admitRepositoryTypeScript } from "./tools/typescript-admission.ts"; console.log(await admitRepositoryTypeScript(process.cwd()));'
      - name: Build the ordinary source for strict project imports
        run: node tools/repository-command.mts script build
      - name: Strict TypeScript check of the existing tooling project
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { admitRepositoryTypeScript } from "./tools/typescript-admission.ts";
          const admitted = await admitRepositoryTypeScript(process.cwd());
          const result = spawnSync(process.execPath, [admitted.entry, "--project", "tsconfig.ci-tooling.json", "--noEmit", "--pretty", "false"], { stdio: "inherit" });
          process.exit(result.status ?? 1);
          NODE
      - name: Observe the six-package hosted signature sequence
        timeout-minutes: 12
        run: node scripts/release-audit-observation.ts
      - name: Retain exact diagnostic sources and public observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/release-audit-observation.ts
            .github/workflows/release-audit-observation.yml
            tsconfig.ci-tooling.json
            .qualification-output/release-audit-observation
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
