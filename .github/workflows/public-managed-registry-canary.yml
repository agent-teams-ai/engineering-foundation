name: Public managed registry canary

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact protected-main release provenance commit
        required: true
        type: string
      cohort_id:
        description: Explicit Cohort v2 ID already registered as a central canary candidate
        required: true
        type: string
      authority_revision:
        description: Exact nonzero current protected-main SHA of agent-teams-ai/.github
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-managed-registry-canary
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify-public-managed-registry
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.expected_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      PUBLIC_CANARY_AUTHORITY_REVISION: ${{ inputs.authority_revision }}
      PUBLIC_CANARY_COHORT_ID: ${{ inputs.cohort_id }}
      PUBLIC_CANARY_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Run read-only six-package public managed registry canary
        env:
          PUBLIC_CANARY_RECEIPT_PATH: ${{ runner.temp }}/public-managed-registry-canary/receipt.json
        run: node scripts/public-managed-registry-canary.mjs
      - name: Retain canonical canary receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-managed-registry-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-managed-registry-canary/receipt.json
          if-no-files-found: error
          retention-days: 30
