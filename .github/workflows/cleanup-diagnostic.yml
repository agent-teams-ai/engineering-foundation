name: Cleanup diagnostic
on:
  push:
    branches: [test/cleanup-qualified-tools-462]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read final candidate checks and existing reviewer workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo = 'repos/agent-teams-ai/engineering-foundation'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cleanup-evidence'
          out.mkdir()
          def api(endpoint):
              result = subprocess.run(['gh', 'api', repo + endpoint], capture_output=True, text=True, timeout=30)
              if result.returncode:
                  return {'readError': result.stderr.strip(), 'exitCode': result.returncode}
              return json.loads(result.stdout)
          expected = '6ac8002ffa6059d41b47550c0218da0597ceb144'
          pr = api('/pulls/462')
          observed = {k: pr.get(k) for k in ('number', 'state', 'merged', 'draft')}
          observed['head'] = pr.get('head', {}).get('sha')
          observed['base'] = pr.get('base', {}).get('sha')
          observed['expectedHeadMatches'] = observed['head'] == expected
          report = {'pr': observed, 'runs': [], 'reviewWorkflows': []}
          for run_id in (41740969785, 41740895085, 41740895258):
              run = api(f'/actions/runs/{run_id}')
              jobs = []
              for page in range(1, 5):
                  response = api(f'/actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}')
                  if 'readError' in response:
                      jobs.append(response)
                      break
                  current = response.get('jobs', [])
                  jobs.extend(current)
                  if len(current) < 100:
                      break
              (out / f'run-{run_id}.json').write_text(json.dumps({'run': run, 'jobs': jobs}, indent=2))
              summary = {k: run.get(k) for k in ('id', 'name', 'head_sha', 'status', 'conclusion', 'run_attempt', 'html_url')}
              summary['jobs'] = [{k: j.get(k) for k in ('id', 'name', 'status', 'conclusion')} for j in jobs]
              report['runs'].append(summary)
              for job in jobs:
                  if job.get('conclusion') != 'failure':
                      continue
                  log = subprocess.run(['gh', 'api', repo + f'/actions/jobs/{job["id"]}/logs'], capture_output=True, timeout=30)
                  text = log.stdout.decode('utf-8-sig', errors='replace')
                  lines = text.splitlines()
                  selected = set(range(max(0, len(lines) - 50), len(lines)))
                  needles = ('not ok', 'AssertionError', 'error TS', '##[error]', 'PUBLIC_API_', 'violations', 'failed', 'failure')
                  for i, line in enumerate(lines):
                      if any(needle in line for needle in needles):
                          selected.update(range(max(0, i - 2), min(len(lines), i + 12)))
                  bounded = '\n'.join(lines[i] for i in sorted(selected))[-50000:]
                  (out / f'failed-job-{job["id"]}.log').write_text(bounded)
          for name in ('reviewrouter-codex.yml', 'reviewrouter-review.yml'):
              workflow = api('/actions/workflows/' + name)
              report['reviewWorkflows'].append({k: workflow.get(k) for k in ('id', 'name', 'path', 'state', 'html_url', 'readError')})
          (out / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          print('Read-only observation; no workflow, branch, protection or review state was modified.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-final-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanup-evidence
          retention-days: 3
