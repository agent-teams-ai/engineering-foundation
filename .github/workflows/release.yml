name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release:publish
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest-release-pr:
    name: attest-release-pr
    needs: release
    if: ${{ needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dispatch and attest release pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUEST: ${{ needs.release.outputs.pullRequestNumber }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          read -r state head_ref head_sha base_ref < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" \
            --jq '[.state, .head.ref, .head.sha, .base.ref] | @tsv')
          if [[ "${state}" != "open" || "${head_ref}" != "changeset-release/main" || "${base_ref}" != "main" ]]; then
            echo "Changesets output does not identify the expected open release pull request." >&2
            exit 1
          fi

          ci_contexts=(check windows-check)
          required_contexts=(check "review / review" windows-check)

          post_status() {
            local context="$1"
            local status_state="$2"
            local description="$3"
            local target_url="$4"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state="${status_state}" \
              -f context="${context}" \
              -f description="${description}" \
              -f target_url="${target_url}" >/dev/null
          }

          for context in "${required_contexts[@]}"; do
            post_status "${context}" pending "Release PR ${context}: dispatched" "${RELEASE_RUN_URL}"
          done

          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref changeset-release/main
          gh workflow run reviewrouter.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f pr_number="${RELEASE_PULL_REQUEST}"

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
            all_completed=1
            for context in "${ci_contexts[@]}"; do
              check_status="$(jq -r --arg context "${context}" \
                '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | .status // "missing"' \
                <<<"${checks}")"
              if [[ "${check_status}" != "completed" ]]; then
                all_completed=0
              fi
            done
            review_state="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
              --jq '[.statuses[] | select(.context == "review / review")] | sort_by(.created_at) | last | .state // "missing"')"
            if [[ "${review_state}" != "success" && "${review_state}" != "failure" && "${review_state}" != "error" ]]; then
              all_completed=0
            fi
            if (( all_completed == 1 )); then
              break
            fi
            sleep 5
          done

          if (( all_completed != 1 )); then
            for context in "${required_contexts[@]}"; do
              post_status "${context}" error "Release PR ${context}: CI timeout" "${RELEASE_RUN_URL}"
            done
            echo "Timed out waiting for release pull request CI." >&2
            exit 1
          fi

          failed=0
          for context in "${ci_contexts[@]}"; do
            read -r conclusion target_url < <(jq -r --arg context "${context}" \
              '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | [.conclusion, .details_url] | @tsv' \
              <<<"${checks}")
            case "${conclusion}" in
              success)
                status_state=success
                ;;
              failure|cancelled|timed_out|startup_failure)
                status_state=failure
                failed=1
                ;;
              *)
                status_state=error
                failed=1
                ;;
            esac
            post_status "${context}" "${status_state}" "Release PR ${context}: ${conclusion}" "${target_url}"
          done

          read -r review_state review_target_url < <(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
            --jq '[.statuses[] | select(.context == "review / review")] | sort_by(.created_at) | last | [.state, .target_url] | @tsv')
          if [[ "${review_state}" != "success" ]]; then
            failed=1
            post_status "review / review" "${review_state}" "Release PR review / review: ${review_state}" "${review_target_url:-${RELEASE_RUN_URL}}"
          fi

          exit "${failed}"
