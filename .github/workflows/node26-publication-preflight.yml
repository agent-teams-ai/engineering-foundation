name: Node26 publication preflight
run-name: Node26 publication preflight ${{ github.run_id }} (workflow ${{ github.sha }})

on:
  push:
    branches: [test/node26-publication-preflight-20261126]

# Diagnostic pre-PR execution only. This workflow does not qualify full-ci,
# publish a package, create a PR, or supply release/cohort admission evidence.
permissions:
  actions: read
  contents: read

concurrency:
  group: node26-publication-preflight-${{ github.sha }}
  cancel-in-progress: false

env:
  PREFLIGHT_CANDIDATE_SHA: c1dd4c72b9195b1ac4b29d81b7366426dd3b5e64
  PREFLIGHT_CANDIDATE_TREE: 7c5aa855506849040617e955861162dcd23ad9ab
  PREFLIGHT_BASE_SHA: bdfdf72c10994df939591b88a9dda5d7759cdc39
  PREFLIGHT_LAUNCHER_PARENT_SHA: 72fecc96c8e37c342556103c61a9be556e8ab18b
  PREFLIGHT_BASE_TREE: 3dfd83f8129ec13af315929e4cc033979fd56b37
  PREFLIGHT_CHANGESET_PATH: .changeset/complete-node26-publication.md
  PREFLIGHT_CHANGESET_BLOB: 1890680f4adfa452c3235a5312a4489fa3433a5b
  PREFLIGHT_WORKFLOW_PATH: .github/workflows/node26-publication-preflight.yml
  NODE_DISABLE_COMPILE_CACHE: "1"
  NX_DAEMON: "false"
  GIT_AUTHOR_NAME: Publication preflight TEST fixture
  GIT_AUTHOR_EMAIL: test@example.invalid
  GIT_COMMITTER_NAME: Publication preflight TEST fixture
  GIT_COMMITTER_EMAIL: test@example.invalid

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Node26 publication pre-PR verification
    if: ${{ github.repository == 'agent-teams-ai/engineering-foundation' && github.event_name == 'push' && github.ref == 'refs/heads/test/node26-publication-preflight-20261126' }}
    runs-on: ubuntu-24.04
    # C1 retains both serial test selections and the complete package qualification.
    # Reserve time after its bounded step for source integrity and diagnostics.
    timeout-minutes: 200
    steps:
      - name: Check out the exact candidate with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREFLIGHT_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind candidate, base, and actual workflow identities
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PREFLIGHT_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PREFLIGHT_CANDIDATE_TREE"
          test "$(git show -s --format=%P HEAD)" = "$PREFLIGHT_BASE_SHA"
          test "$(git rev-parse "${PREFLIGHT_BASE_SHA}^{tree}")" = "$PREFLIGHT_BASE_TREE"
          test "$(git diff --name-status --no-renames "$PREFLIGHT_BASE_SHA" HEAD)" = $'A\t'"$PREFLIGHT_CHANGESET_PATH"
          test "$(git ls-tree HEAD -- "$PREFLIGHT_CHANGESET_PATH")" = "100644 blob ${PREFLIGHT_CHANGESET_BLOB}"$'\t'"$PREFLIGHT_CHANGESET_PATH"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$PREFLIGHT_WORKFLOW_PATH@$GITHUB_REF"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$PREFLIGHT_LAUNCHER_PARENT_SHA"
          test "$(git diff --name-status --no-renames "$PREFLIGHT_BASE_SHA" "$GITHUB_SHA")" = $'A\t'"$PREFLIGHT_WORKFLOW_PATH"
          preflight_workflow_blob="$(git rev-parse "${GITHUB_SHA}:${PREFLIGHT_WORKFLOW_PATH}")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$PREFLIGHT_WORKFLOW_PATH")" = "100644 blob ${preflight_workflow_blob}"$'\t'"$PREFLIGHT_WORKFLOW_PATH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$PREFLIGHT_BASE_SHA"
          if git show-ref --verify --quiet refs/heads/main; then
            test "$(git rev-parse refs/heads/main)" = "$PREFLIGHT_BASE_SHA"
          else
            git branch --no-track main "$PREFLIGHT_BASE_SHA"
          fi
          test "$(git rev-parse refs/heads/main)" = "$PREFLIGHT_BASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          preflight_evidence="$RUNNER_TEMP/publication-preflight-evidence"
          preflight_temporary="$RUNNER_TEMP/publication-preflight-tmp"
          mkdir -p "$preflight_evidence" "$preflight_temporary"
          printf 'PREFLIGHT_EVIDENCE_DIR=%s\n' "$preflight_evidence" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$preflight_temporary" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_SOURCE_ROOT=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_SOURCE_SHA=%s\n' "$PREFLIGHT_CANDIDATE_SHA" >> "$GITHUB_ENV"
          {
            printf 'candidate=%s\n' "$PREFLIGHT_CANDIDATE_SHA"
            printf 'candidate_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'base=%s\n' "$PREFLIGHT_BASE_SHA"
            printf 'base_tree=%s\n' "$PREFLIGHT_BASE_TREE"
            printf 'changeset_blob=%s\n' "$PREFLIGHT_CHANGESET_BLOB"
            printf 'workflow_blob=%s\n' "$preflight_workflow_blob"
            printf 'event_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } | tee "$preflight_evidence/source-identities.txt"
          git diff --stat "$PREFLIGHT_BASE_SHA" "$PREFLIGHT_CANDIDATE_SHA" > "$preflight_evidence/committed-delta.txt"
          git diff --binary "$PREFLIGHT_BASE_SHA" "$PREFLIGHT_CANDIDATE_SHA" > "$preflight_evidence/committed-delta.patch"
          git show "HEAD:$PREFLIGHT_CHANGESET_PATH" > "$preflight_evidence/changeset.md"
          git show "${GITHUB_SHA}:${PREFLIGHT_WORKFLOW_PATH}" > "$preflight_evidence/executed-workflow.yml"

      # Preserve the ordinary dependency-review/SBOM barrier before installing
      # project dependencies or executing candidate tooling.
      - name: Review dependency changes for the exact base and candidate
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ env.PREFLIGHT_BASE_SHA }}
          head-ref: ${{ env.PREFLIGHT_CANDIDATE_SHA }}
          fail-on-severity: moderate
          vulnerability-check: true
          warn-only: false
          comment-summary-in-pr: never
      - name: Retain the candidate SBOM before installation
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: publication-preflight-sbom-${{ env.PREFLIGHT_CANDIDATE_SHA }}.spdx.json
          output-file: ${{ runner.temp }}/publication-preflight-evidence/candidate-sbom.spdx.json
          upload-release-assets: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        id: setup-pnpm
        env:
          pnpm_config_pm_on_fail: ignore
        with:
          version: "11.20.0"
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Retain the physical Node24 controller and legacy test runtime
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v24.21.0"
          preflight_node24="$(command -v node)"
          printf 'PACK_TEST_GENERATION2_NODE=%s\n' "$preflight_node24" >> "$GITHUB_ENV"
          printf 'MANAGED_TEST_NODE24_SOURCE=%s\n' "$preflight_node24" >> "$GITHUB_ENV"
      # This is the existing historical managed-runtime TEST coordinate. It is
      # distinct from the current source/default/retained target Node26.11.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - name: Retain the historical managed Node26 test coordinate
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v26.10.0"
          printf 'MANAGED_TEST_NODE26_SOURCE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bind the current Node26, Bun, and pnpm executables
        env:
          PREFLIGHT_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
          PREFLIGHT_PNPM_EXECUTABLE: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v26.11.1"
          test "$("$PREFLIGHT_BUN_EXECUTABLE" --version)" = "1.4.3"
          test "$("$PREFLIGHT_PNPM_EXECUTABLE" --pm-on-fail=ignore --version)" = "11.20.0"
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE=%s\n' "$PREFLIGHT_BUN_EXECUTABLE" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT=%s\n' "$PREFLIGHT_PNPM_EXECUTABLE" >> "$GITHUB_ENV"
          {
            printf 'node24=%s\n' "$("$PACK_TEST_GENERATION2_NODE" --version)"
            printf 'managed_node26=%s\n' "$("$MANAGED_TEST_NODE26_SOURCE" --version)"
            printf 'default_node=%s\n' "$(node --version)"
            printf 'bun=%s\n' "$("$PREFLIGHT_BUN_EXECUTABLE" --version)"
            printf 'pnpm=%s\n' "$("$PREFLIGHT_PNPM_EXECUTABLE" --pm-on-fail=ignore --version)"
          } | tee "$PREFLIGHT_EVIDENCE_DIR/runtime-identities.txt"

      - name: Provision the qualified npm migration verifier
        run: |
          set -Eeuo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = "11.19.0"
      - name: Install the source-owned Bun profile
        run: |
          set -Eeuo pipefail
          test ! -d node_modules
          bun tools/dev.mts install 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/install.log"
      - name: Admit the compiler metadata before the source build
        run: |
          set -Eeuo pipefail
          node --input-type=module -e 'import { admitRepositoryTypeScript } from "./tools/typescript-admission.ts"; console.log(JSON.stringify(await admitRepositoryTypeScript(process.cwd())));' \
            2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/compiler-admission.log"
      - name: Build with the repository-admitted compiler
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts build 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/build.log"
      - name: Provision all existing managed-test prerequisites
        run: |
          set -Eeuo pipefail
          node scripts/provision-managed-test-tools.mjs 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/managed-test-provisioning.log"

      - name: Inspect the actual official Changesets release plan
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' | tee "$PREFLIGHT_EVIDENCE_DIR/changesets-plan.json"
          import { collectChangesetsReleasePlan } from "./scripts/npm-package-bootstrap-release-plan.mts";
          console.log(JSON.stringify(await collectChangesetsReleasePlan(), null, 2));
          NODE
          jq --exit-status --argjson packages '[
            "@agent-teams/repository-mutation",
            "@agent-teams/document-authoring",
            "@agent-teams/docs-protocol",
            "@agent-teams/docs-protocol-agent-teams",
            "@agent-teams/docs-protocol-mcp",
            "@agent-teams/engineering-foundation",
            "@agent-teams/feature-module-standard"
          ]' '
            (.preState == null) and
            ((.changesets | length) == 1) and
            (.changesets[0].id == "complete-node26-publication") and
            (([.changesets[0].releases[].name] | sort) == ($packages | sort)) and
            all(.changesets[0].releases[]; .type == "patch") and
            (([.releases[].name] | sort) == ($packages | sort)) and
            all(.releases[]; .type == "patch" and .oldVersion != .newVersion)
          ' "$PREFLIGHT_EVIDENCE_DIR/changesets-plan.json" \
            | tee "$PREFLIGHT_EVIDENCE_DIR/changesets-plan-validation.log"
      - name: Check Changeset coverage against the exact source base
        run: |
          set -Eeuo pipefail
          bun scripts/check-changeset-coverage.mjs --base "$PREFLIGHT_BASE_SHA" \
            2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/changeset-coverage.log"

      - name: Run the required fast gate
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts check:fast 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/check-fast.log"
      - name: Run the required workflow security gate on the candidate
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts security:workflows 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/security-workflows.log"
      - name: Run the source-owned full changed gate once over the complete delta
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$PREFLIGHT_BASE_SHA"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$PREFLIGHT_BASE_SHA"
          bun tools/dev.mts check:changed 2>&1 | tee "$PREFLIGHT_EVIDENCE_DIR/check-changed.log"
          expected='check-changed: feedback-only (mutable-input-binding-unverified); 1 executed steps; input binding unverified'
          test "$(tail -n 1 "$PREFLIGHT_EVIDENCE_DIR/check-changed.log")" = "$expected"

      - name: Preserve diagnostics and verify exact source remains unchanged
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          preflight_evidence="$RUNNER_TEMP/publication-preflight-evidence"
          mkdir -p "$preflight_evidence"
          git diff --binary HEAD > "$preflight_evidence/final-source.patch"
          git --no-optional-locks status --porcelain=v1 --untracked-files=all > "$preflight_evidence/final-source-status.txt"
          test "$(git rev-parse HEAD)" = "$PREFLIGHT_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PREFLIGHT_CANDIDATE_TREE"
          test ! -s "$preflight_evidence/final-source.patch"
          test ! -s "$preflight_evidence/final-source-status.txt"
      - name: Upload diagnostic evidence for this candidate and actual workflow run
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-preflight-${{ env.PREFLIGHT_CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication-preflight-evidence
            .worker-tmp/check-changed-*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
