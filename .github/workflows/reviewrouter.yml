name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reviewrouter-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve-pr
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve immutable pull request identity
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || {
            echo "pr_number must be a positive integer" >&2
            exit 1
          }
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          if [[ "${state}" != "open" ]]; then
            echo "Review target must be an open pull request." >&2
            exit 1
          fi
          {
            echo "number=${pr_number}"
            echo "head_sha=$(jq -r '.head.sha' <<<"${pr_json}")"
          } >> "${GITHUB_OUTPUT}"

  review:
    needs: resolve
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: agent-teams-ai/.github/.github/workflows/reviewrouter-reusable.yml@0cb2fc11d001cd93f847199285f796da188f7ad8 # reviewrouter-v1.0.0
    with:
      pr_number: ${{ needs.resolve.outputs.number }}
      review_drafts: ${{ vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true' }}
      timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
      max_changed_lines: ${{ fromJSON(vars.REVIEW_ROUTER_MAX_CHANGED_LINES || '250000') }}
      codex_model: ${{ vars.REVIEW_CODEX_MODEL || 'gpt-5.6-sol' }}
    secrets: inherit

  attest-dispatch:
    name: attest-dispatch
    needs: [resolve, review]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    steps:
      - name: Bind review result to the reviewed pull request SHA
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail

          [[ "${RESOLVE_RESULT}" == "success" && "${PR_NUMBER}" =~ ^[1-9][0-9]*$ && "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Review dispatch did not resolve immutable pull request evidence." >&2
            exit 1
          }
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_state="$(jq -r '.state' <<<"${pr_json}")"
          current_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          current_head_repository="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          status_state=failure
          description="ReviewRouter failed for the immutable release PR revision."
          if [[ "${current_state}" == "open" && "${current_head_repository}" == "${GITHUB_REPOSITORY}" && "${current_head_sha}" == "${EXPECTED_HEAD_SHA}" && "${REVIEW_RESULT}" == "success" ]]; then
            status_state=success
            description="ReviewRouter passed for the immutable release PR revision."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
            -f state="${status_state}" \
            -f context="review / review" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          [[ "${status_state}" == "success" ]]
