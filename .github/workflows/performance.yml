name: Performance signals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory-performance:
    name: advisory-performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun tools/dev.mts install
      - run: bun tools/dev.mts build
      - name: Collect advisory benchmark signals
        run: node scripts/run-performance-benchmarks.mjs --output "${RUNNER_TEMP}/foundation-performance.json"
      - name: Upload immutable benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-performance.json
          if-no-files-found: error
          retention-days: 30
