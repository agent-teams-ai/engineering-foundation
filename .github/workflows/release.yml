name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pullRequestNumber: ${{ steps.release-pr.outputs.number }}
      pullRequestBaseSha: ${{ steps.release-pr.outputs.base_sha }}
      pullRequestHeadSha: ${{ steps.release-pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release:publish
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind release pull request revision
        id: release-pr
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROCESSED_MAIN_SHA: ${{ github.sha }}
          RELEASE_PULL_REQUEST: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -Eeuo pipefail

          pull_request_json="$(mktemp)"
          stable_pull_request_json="$(mktemp)"
          files_json="$(mktemp)"
          proof_error="$(mktemp)"
          trap 'rm -f "${pull_request_json}" "${stable_pull_request_json}" "${files_json}" "${proof_error}"' EXIT

          release_branch_revision() {
            local line sha ref extra
            line="$(git ls-remote --refs origin refs/heads/changeset-release/main)"
            read -r sha ref extra <<< "${line}"
            if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ || "${ref}" != "refs/heads/changeset-release/main" || -n "${extra:-}" ]]; then
              echo "Release branch does not resolve to one exact revision." >&2
              return 1
            fi
            printf '%s\n' "${sha}"
          }

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            branch_head_sha="$(release_branch_revision)"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${pull_request_json}"
            read -r number state head_ref head_sha base_ref base_sha < <(jq -r \
              '[.number, .state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv' \
              "${pull_request_json}")
            if [[ ! "${number}" =~ ^[1-9][0-9]*$ || "${number}" != "${RELEASE_PULL_REQUEST}" || \
              "${state}" != "open" || "${head_ref}" != "changeset-release/main" || \
              "${base_ref}" != "main" || ! "${head_sha}" =~ ^[0-9a-f]{40}$ || \
              ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Changesets output does not identify the expected open release pull request." >&2
              exit 1
            fi

            current_main_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ ! "${PROCESSED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ || \
              ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release binding received a malformed main revision." >&2
              exit 1
            fi
            git fetch --no-tags origin \
              "${PROCESSED_MAIN_SHA}" "${current_main_sha}" "${base_sha}" "${head_sha}" \
              "${branch_head_sha}"
            : > "${proof_error}"
            if jq -n \
              --arg currentMainSha "${current_main_sha}" \
              --arg expectedBaseSha "${PROCESSED_MAIN_SHA}" \
              --arg expectedHeadSha "${branch_head_sha}" \
              --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
              --slurpfile pullRequest "${pull_request_json}" \
              '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
              node scripts/check-release-pr-freshness.mjs \
                --processed-main "${PROCESSED_MAIN_SHA}" 2> "${proof_error}" && \
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}/files?per_page=100" > \
                "${files_json}" && \
              node scripts/check-release-pr-files.mjs \
                --base "${base_sha}" --head "${head_sha}" < "${files_json}" 2>> "${proof_error}"; then
              stable_branch_head_sha="$(release_branch_revision)"
              stable_current_main_sha="$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > \
                "${stable_pull_request_json}"
              read -r stable_number stable_state stable_head_ref stable_head_sha \
                stable_base_ref stable_base_sha < <(jq -r \
                '[.number, .state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv' \
                "${stable_pull_request_json}")
              if [[ "${stable_number}" == "${number}" && "${stable_state}" == "${state}" && \
                "${stable_head_ref}" == "${head_ref}" && "${stable_head_sha}" == "${head_sha}" && \
                "${stable_base_ref}" == "${base_ref}" && "${stable_base_sha}" == "${base_sha}" && \
                "${stable_branch_head_sha}" == "${branch_head_sha}" && \
                "${stable_current_main_sha}" == "${current_main_sha}" ]]; then
                {
                  printf 'number=%s\n' "${number}"
                  printf 'base_sha=%s\n' "${base_sha}"
                  printf 'head_sha=%s\n' "${head_sha}"
                } >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
            sleep 1
          done

          echo "Release pull request revision did not converge on complete exact-head evidence." >&2
          cat "${proof_error}" >&2
          exit 1

  attest-release-pr:
    name: attest-release-pr
    needs: release
    if: ${{ needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dispatch and attest release pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_BASE_SHA: ${{ needs.release.outputs.pullRequestBaseSha }}
          EXPECTED_RELEASE_HEAD_SHA: ${{ needs.release.outputs.pullRequestHeadSha }}
          PROCESSED_MAIN_SHA: ${{ github.sha }}
          RELEASE_PULL_REQUEST: ${{ needs.release.outputs.pullRequestNumber }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          ci_contexts=(check windows-check)
          release_gate_context=ReviewGate
          head_sha="${EXPECTED_RELEASE_HEAD_SHA}"
          status_finalized=0

          post_status() {
            local context="$1"
            local status_state="$2"
            local description="$3"
            local target_url="$4"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state="${status_state}" \
              -f context="${context}" \
              -f description="${description}" \
              -f target_url="${target_url}" >/dev/null
          }

          mark_attestation_error() {
            local exit_code="$?"
            trap - ERR
            if (( status_finalized == 0 )); then
              set +e
              for context in "${ci_contexts[@]}"; do
                post_status "${context}" error "Release PR attestation failed" "${RELEASE_RUN_URL}"
              done
              post_status "${release_gate_context}" error "Release PR attestation failed closed" "${RELEASE_RUN_URL}"
            fi
            exit "${exit_code}"
          }

          fail_attestation() {
            local description="$1"
            status_finalized=1
            for context in "${ci_contexts[@]}"; do
              post_status "${context}" failure "${description}" "${RELEASE_RUN_URL}"
            done
            post_status "${release_gate_context}" failure "${description}" "${RELEASE_RUN_URL}"
            exit 1
          }

          trap mark_attestation_error ERR

          pull_request_json="$(mktemp)"
          final_pull_request_json="$(mktemp)"
          trap 'rm -f "${pull_request_json}" "${final_pull_request_json}"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${pull_request_json}"
          read -r head_sha base_sha < <(jq -r \
            '[.head.sha, .base.sha] | @tsv' "${pull_request_json}")
          current_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "${EXPECTED_RELEASE_BASE_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${EXPECTED_RELEASE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${PROCESSED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ || \
            ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${base_sha}" =~ ^[0-9a-f]{40}$ || ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            fail_attestation "Release PR revision tuple is malformed"
          fi

          for context in "${ci_contexts[@]}"; do
            post_status "${context}" pending "Release PR ${context}: dispatched" "${RELEASE_RUN_URL}"
          done
          post_status "${release_gate_context}" pending "Validating generated release evidence" "${RELEASE_RUN_URL}"

          git fetch --no-tags origin \
            "${PROCESSED_MAIN_SHA}" "${current_main_sha}" "${base_sha}" "${head_sha}"
          if ! jq -n \
            --arg currentMainSha "${current_main_sha}" \
            --arg expectedBaseSha "${EXPECTED_RELEASE_BASE_SHA}" \
            --arg expectedHeadSha "${EXPECTED_RELEASE_HEAD_SHA}" \
            --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
            --slurpfile pullRequest "${pull_request_json}" \
            '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
            node scripts/check-release-pr-freshness.mjs \
              --processed-main "${PROCESSED_MAIN_SHA}"; then
            fail_attestation "Release PR is stale or incomplete"
          fi
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}/files?per_page=100" | \
            node scripts/check-release-pr-files.mjs --base "${base_sha}" --head "${head_sha}"; then
            fail_attestation "Release PR contains unreviewed changes"
          fi

          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref changeset-release/main

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
            all_completed=1
            for context in "${ci_contexts[@]}"; do
              check_status="$(jq -r --arg context "${context}" \
                '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | .status // "missing"' \
                <<<"${checks}")"
              if [[ "${check_status}" != "completed" ]]; then
                all_completed=0
              fi
            done
            if (( all_completed == 1 )); then
              break
            fi
            sleep 5
          done

          if (( all_completed != 1 )); then
            status_finalized=1
            for context in "${ci_contexts[@]}"; do
              post_status "${context}" error "Release PR ${context}: CI timeout" "${RELEASE_RUN_URL}"
            done
            post_status "${release_gate_context}" error "Release PR CI timed out" "${RELEASE_RUN_URL}"
            echo "Timed out waiting for release pull request CI." >&2
            exit 1
          fi

          failed=0
          conclusions=()
          target_urls=()
          for context in "${ci_contexts[@]}"; do
            read -r conclusion target_url < <(jq -r --arg context "${context}" \
              '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | [.conclusion, .details_url] | @tsv' \
              <<<"${checks}")
            case "${conclusion}" in
              success)
                ;;
              failure|cancelled|timed_out|startup_failure)
                failed=1
                ;;
              *)
                failed=1
                ;;
            esac
            conclusions+=("${conclusion}")
            target_urls+=("${target_url}")
          done

          if (( failed != 0 )); then
            status_finalized=1
            for index in "${!ci_contexts[@]}"; do
              post_status "${ci_contexts[index]}" failure \
                "Release PR ${ci_contexts[index]}: ${conclusions[index]}" \
                "${target_urls[index]}"
            done
            post_status "${release_gate_context}" failure "Generated release CI failed" "${RELEASE_RUN_URL}"
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" > "${final_pull_request_json}"
          final_current_main_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          final_head_sha="$(jq -r '.head.sha' "${final_pull_request_json}")"
          final_base_sha="$(jq -r '.base.sha' "${final_pull_request_json}")"
          if [[ ! "${final_current_main_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${final_head_sha}" =~ ^[0-9a-f]{40}$ || \
            ! "${final_base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            fail_attestation "Final release PR revision tuple is malformed"
          fi
          git fetch --no-tags origin "${final_current_main_sha}" "${final_head_sha}"
          if ! jq -n \
            --arg currentMainSha "${final_current_main_sha}" \
            --arg expectedBaseSha "${EXPECTED_RELEASE_BASE_SHA}" \
            --arg expectedHeadSha "${head_sha}" \
            --arg expectedPullRequestNumber "${RELEASE_PULL_REQUEST}" \
            --slurpfile pullRequest "${final_pull_request_json}" \
            '{currentMainSha: $currentMainSha, expectedBaseSha: $expectedBaseSha, expectedHeadSha: $expectedHeadSha, expectedPullRequestNumber: $expectedPullRequestNumber, pullRequest: $pullRequest[0]}' | \
            node scripts/check-release-pr-freshness.mjs \
              --processed-main "${PROCESSED_MAIN_SHA}"; then
            fail_attestation "Release PR changed or main advanced during CI"
          fi

          status_finalized=1
          for index in "${!ci_contexts[@]}"; do
            post_status "${ci_contexts[index]}" success \
              "Release PR ${ci_contexts[index]}: ${conclusions[index]}" \
              "${target_urls[index]}"
          done
          post_status "${release_gate_context}" success \
            "Generated release evidence and exact-head CI passed" "${RELEASE_RUN_URL}"
