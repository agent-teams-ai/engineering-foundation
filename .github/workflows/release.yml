name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}
      pullRequestHeadSha: ${{ steps.release-pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release:publish
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind release pull request revision
        id: release-pr
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUEST: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail

          read -r state head_ref head_sha base_ref < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" \
            --jq '[.state, .head.ref, .head.sha, .base.ref] | @tsv')
          if [[ "${state}" != "open" || "${head_ref}" != "changeset-release/main" || "${base_ref}" != "main" ]]; then
            echo "Changesets output does not identify the expected open release pull request." >&2
            exit 1
          fi
          printf 'head_sha=%s\n' "${head_sha}" >> "${GITHUB_OUTPUT}"

  review-release-pr:
    name: review-release-pr
    needs: release
    if: ${{ needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@e982a5e3aebe71404dac948fd67cb7291e8be0fb
    with:
      runtime_ref: "e982a5e3aebe71404dac948fd67cb7291e8be0fb"
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      static_runtime_env_json: '{"SKIP_BOTS":"false"}'
      pr_number: ${{ needs.release.outputs.pullRequestNumber }}
      review_head_sha: ${{ needs.release.outputs.pullRequestHeadSha }}
      provider_instance_id: "codex-rotating:1316243988"
      workflow_schema_version: 2
      max_changed_lines: ${{ vars.REVIEW_ROUTER_MAX_CHANGED_LINES }}
      review_timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}

  attest-release-pr:
    name: attest-release-pr
    needs: [release, review-release-pr]
    if: ${{ always() && needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dispatch and attest release pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUEST: ${{ needs.release.outputs.pullRequestNumber }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          read -r state head_ref head_sha base_ref < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" \
            --jq '[.state, .head.ref, .head.sha, .base.ref] | @tsv')
          if [[ "${state}" != "open" || "${head_ref}" != "changeset-release/main" || "${base_ref}" != "main" ]]; then
            echo "Changesets output does not identify the expected open release pull request." >&2
            exit 1
          fi

          ci_contexts=(check windows-check)

          post_status() {
            local context="$1"
            local status_state="$2"
            local description="$3"
            local target_url="$4"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state="${status_state}" \
              -f context="${context}" \
              -f description="${description}" \
              -f target_url="${target_url}" >/dev/null
          }

          for context in "${ci_contexts[@]}"; do
            post_status "${context}" pending "Release PR ${context}: dispatched" "${RELEASE_RUN_URL}"
          done

          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref changeset-release/main

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
            all_completed=1
            for context in "${ci_contexts[@]}"; do
              check_status="$(jq -r --arg context "${context}" \
                '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | .status // "missing"' \
                <<<"${checks}")"
              if [[ "${check_status}" != "completed" ]]; then
                all_completed=0
              fi
            done
            review_state="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
              --jq '[.statuses[] | select(.context == "ReviewRouter")] | sort_by(.created_at) | last | .state // "missing"')"
            if [[ "${review_state}" != "success" && "${review_state}" != "failure" && "${review_state}" != "error" ]]; then
              all_completed=0
            fi
            if (( all_completed == 1 )); then
              break
            fi
            sleep 5
          done

          if (( all_completed != 1 )); then
            for context in "${ci_contexts[@]}"; do
              post_status "${context}" error "Release PR ${context}: CI timeout" "${RELEASE_RUN_URL}"
            done
            echo "Timed out waiting for release pull request CI." >&2
            exit 1
          fi

          failed=0
          for context in "${ci_contexts[@]}"; do
            read -r conclusion target_url < <(jq -r --arg context "${context}" \
              '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | [.conclusion, .details_url] | @tsv' \
              <<<"${checks}")
            case "${conclusion}" in
              success)
                status_state=success
                ;;
              failure|cancelled|timed_out|startup_failure)
                status_state=failure
                failed=1
                ;;
              *)
                status_state=error
                failed=1
                ;;
            esac
            post_status "${context}" "${status_state}" "Release PR ${context}: ${conclusion}" "${target_url}"
          done

          read -r review_state review_target_url < <(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
            --jq '[.statuses[] | select(.context == "ReviewRouter")] | sort_by(.created_at) | last | [.state, .target_url] | @tsv')
          if [[ "${review_state}" != "success" ]]; then
            failed=1
            echo "ReviewRouter finished with ${review_state}; its App-owned status is preserved (${review_target_url:-no target URL})." >&2
          fi

          exit "${failed}"
