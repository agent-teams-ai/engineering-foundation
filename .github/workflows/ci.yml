name: Lint context focused diagnostic (never merge)
run-name: Lint context diagnostic @${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-context-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize job-owned diagnostic retention
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/lint-context-focused/tmp"
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}/lint-context-focused/tmp" >> "$GITHUB_ENV"
          printf 'head=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "${RUNNER_TEMP}/lint-context-focused/workflow-source.txt"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "26.11.1" }
      - name: Bind physical runtime executables
        shell: bash
        env:
          SELECTED_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
        run: |
          set -Eeuo pipefail
          physical_node="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          physical_bun="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$SELECTED_BUN_EXECUTABLE")"
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\n' "$physical_node" >> "$GITHUB_ENV"
          printf 'AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE=%s\n' "$physical_bun" >> "$GITHUB_ENV"
      - name: Canonical install
        shell: bash
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts install 2>&1 | tee "${RUNNER_TEMP}/lint-context-focused/install.log"
      - name: Canonical build
        shell: bash
        run: |
          set -Eeuo pipefail
          bun tools/dev.mts build 2>&1 | tee "${RUNNER_TEMP}/lint-context-focused/build.log"
      - name: Check the owning strict tooling project
        shell: bash
        run: |
          set -Eeuo pipefail
          "${AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE}" node_modules/typescript/bin/tsc -p tsconfig.ci-tooling.json 2>&1 | tee "${RUNNER_TEMP}/lint-context-focused/typecheck.log"
      - name: Run the complete context and lint scope test file once
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o noclobber
          set +e
          "${AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE}" --test --test-concurrency=1 --test-reporter=tap tests/repository-lint-scope.test.ts > "${RUNNER_TEMP}/lint-context-focused/test.stdout.tap" 2> "${RUNNER_TEMP}/lint-context-focused/test.stderr.log"
          status=$?
          set -e
          printf '{"status":%s,"head":"%s","run":"%s","attempt":"%s"}\n' "$status" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "${RUNNER_TEMP}/lint-context-focused/result.json"
          cat "${RUNNER_TEMP}/lint-context-focused/test.stdout.tap"
          cat "${RUNNER_TEMP}/lint-context-focused/test.stderr.log" >&2
          exit "$status"
      - name: Retain focused context evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-context-focused-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lint-context-focused
          if-no-files-found: error
          retention-days: 14
