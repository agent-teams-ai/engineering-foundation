name: CI
# Both label forms request the original matrix; neither label grants authority.
run-name: >-
  ${{ github.event_name == 'pull_request' && (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:'))
      && format('Full CI #{0} @{1} on {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)
      || format('CI {0} run {1}', github.event_name, github.run_id) }}

on:
  pull_request:
    types: [labeled]
  merge_group: {}
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Different snapshots cannot cancel each other; required checks bind the head.
  group: >-
    ${{ github.event_name == 'pull_request'
        && ((github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) && format('foundation-pr-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)
            || format('foundation-ci-unrequested-{0}', github.run_id))
        || format('foundation-ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  shadow-classifier:
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    name: advisory-shadow-classifier
    needs: dependency-review
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - name: Observe conservative CI classification
        run: bun scripts/ci-shadow-classifier.mjs --github-event

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          vulnerability-check: true
          warn-only: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: engineering-foundation-sbom.spdx.json
          upload-release-assets: false

  node26-compatibility:
    name: node-compatibility (${{ matrix.lane }})
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    permissions:
      contents: read
    env:
      AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE: node
      AGENT_TEAMS_FOUNDATION_SOURCE_ROOT: ${{ github.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: node24-compatibility
            node-version: "24.21.0"
          - lane: node26-production-default
            node-version: "26.11.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use a finite job-owned temporary directory
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpdir="${RUNNER_TEMP}/node26-compatibility"
          mkdir -p "${tmpdir}"
          printf 'TMPDIR=%s\n' "${tmpdir}" >> "$GITHUB_ENV"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        id: setup-pnpm
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Retain the compatibility test Node executable
        run: printf "COMPAT_NODE_EXECUTABLE=%s\n" "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Retain the admitted build Node executable
        run: printf "AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\n" "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node-version }}" }
      - name: Require a clean compatibility install
        run: test ! -d node_modules
      - name: Install the clean Node/pnpm profile projection
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_SHA: ${{ github.sha }}
          AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tools/dev.mts --profile node install
      - run: pnpm dependencies:peers:check
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - run: pnpm rebuild
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - name: Qualify publishable packages in a fresh strict-engine consumer
        run: pnpm node-compatibility:qualification
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - name: Run focused observable compatibility regressions
        env:
          AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
        run: node --test --test-concurrency=1 tests/node-test-execution.test.mjs tests/docs-protocol-current-policy.test.mjs tests/registry-install-policy.test.mjs packages/docs-protocol/tests/qualification.test.mjs
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}

  linux-static:
    name: linux-static
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun tools/dev.mts install
      - run: bun tools/dev.mts build
      - name: Validate package Changeset coverage
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'changeset-release/main') }}
        env:
          FOUNDATION_CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/check-changeset-coverage.mjs
      - run: bun run lint
      - run: bun run typecheck
      - name: Provision qualified npm migration verifier
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Run Foundation check
        id: foundation-check
        run: |
          node scripts/public-api-native-migration-cli.ts qualify --ordinary-report "$RUNNER_TEMP/foundation-check.json" --migration-report "$RUNNER_TEMP/native-api-migration.json"
        env:
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Show SDK public API report
        if: ${{ always() && steps.foundation-check.outcome != 'skipped' }}
        run: bun scripts/sdk-api-ci-summary.mjs "$RUNNER_TEMP/foundation-check.json"
      - name: Show native API migration qualification
        if: ${{ always() && steps.foundation-check.outcome != 'skipped' }}
        run: |
          if test -f "$RUNNER_TEMP/native-api-migration.json"; then
            cat "$RUNNER_TEMP/native-api-migration.json"
          fi
      - run: bun run release-owned-files:check
        env:
          FOUNDATION_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      - run: bun run architecture:patterns
      - run: bun run architecture:patterns:test
      - run: bun run nx:graph:check
      - run: bun tools/dev.mts security:workflows
      - run: bun run dead-code:check
      - run: node tools/repository-command.mts script parser-spike:check
  linux-tests:
    name: linux-tests-${{ matrix.pair.first }}-${{ matrix.pair.second }}
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { first: "1", second: "2" }
          - { first: "3", second: "4" }
          - { first: "5", second: "6" }
          - { first: "7", second: "8" }
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
      FIRST_SHARD: ${{ matrix.pair.first }}
      SECOND_SHARD: ${{ matrix.pair.second }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: b
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: setup-bun
        with: { bun-version: "1.4.3" }
      # Legacy managed generation2 suites (shards 1 and 2 included) run on this Node 24; the default stays Node 26.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.21.0" }
      - name: Retain Node 24 for legacy generation2 test suites
        run: printf 'PACK_TEST_GENERATION2_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - name: Retain pinned Node 24 test source
        if: ${{ matrix.pair.second == '4' }}
        run: printf 'MANAGED_TEST_NODE24_SOURCE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.pair.second == '4' }}
        with: { node-version: "26.10.0" }
      - name: Retain pinned Node 26 test source
        if: ${{ matrix.pair.second == '4' }}
        run: printf 'MANAGED_TEST_NODE26_SOURCE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: a/.node-version
      - name: Build both isolated producers
        run: node a/scripts/run-ci-test-pair.mts build "$FIRST_SHARD" "$SECOND_SHARD"
        env:
          AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
      - name: Qualify managed process transport under pinned Bun on Linux
        if: ${{ matrix.pair.first == '1' }}
        working-directory: a
        shell: bash
        run: |
          set -Eeuo pipefail
          PROCESS_RUNTIME_DELEGATION_NODE="$(node -p 'process.execPath')"
          AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE="${PROCESS_RUNTIME_DELEGATION_NODE}"
          AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE="$(bun -p 'process.execPath')"
          export PROCESS_RUNTIME_DELEGATION_NODE AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE
          "${AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE}" tests/process-runtime-delegation-under-bun.mts
      - name: Provision public pinned managed test copies
        if: ${{ matrix.pair.second == '4' }}
        working-directory: b
        env:
          RUNNER_TEMP: ${{ runner.temp }}/producer-4
          TMPDIR: ${{ runner.temp }}/producer-4
        run: node scripts/provision-managed-test-tools.mjs
      - name: Run both isolated test shards
        id: test-pair
        run: node a/scripts/run-ci-test-pair.mts test "$FIRST_SHARD" "$SECOND_SHARD"
        env:
          AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE: ${{ steps.setup-bun.outputs.bun-path }}
      - name: Upload first raw coverage evidence
        if: ${{ always() && steps.test-pair.outputs.first-status == '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence-${{ github.sha }}-shard-${{ matrix.pair.first }}
          path: a/.coverage-evidence/shard-${{ matrix.pair.first }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
      - name: Upload first advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-linux-test-${{ matrix.pair.first }}
          path: ${{ runner.temp }}/producer-${{ matrix.pair.first }}/test-timing/linux-test-${{ matrix.pair.first }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload second raw coverage evidence
        if: ${{ always() && steps.test-pair.outputs.second-status == '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence-${{ github.sha }}-shard-${{ matrix.pair.second }}
          path: b/.coverage-evidence/shard-${{ matrix.pair.second }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1
      - name: Upload second advisory test timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-${{ github.sha }}-linux-test-${{ matrix.pair.second }}
          path: ${{ runner.temp }}/producer-${{ matrix.pair.second }}/test-timing/linux-test-${{ matrix.pair.second }}
          if-no-files-found: warn
          retention-days: 14

  linux-coverage:
    name: linux-coverage
    needs:
      - dependency-review
      - linux-tests
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - run: bun tools/dev.mts install
      - run: bun tools/dev.mts build
      - name: Download exact-head shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-evidence-${{ github.sha }}-shard-*
          path: .coverage-evidence/downloaded
          merge-multiple: false
      - name: Validate, merge once, and enforce coverage thresholds
        run: node scripts/merge-test-coverage-evidence.mjs --input .coverage-evidence/downloaded --head-sha "${{ github.sha }}"

  linux-package:
    name: linux-package
    # Give the long test lanes first access to shared hosted runner capacity.
    needs: [dependency-review, linux-static]
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Use a finite job-owned temporary directory
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpdir="${RUNNER_TEMP}/linux-package"
          mkdir -p "${tmpdir}"
          printf 'TMPDIR=%s\n' "${tmpdir}" >> "$GITHUB_ENV"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        id: setup-pnpm
        with: { version: "11.20.0", install: false }
      # Managed generation2 consumer gates run on an explicit Node 24; the default Node 26 stays on PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.21.0" }
      - name: Retain Node 24 for managed generation2 consumer gates
        run: printf 'PACK_TEST_GENERATION2_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Install the clean Node/pnpm package projection
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_SHA: ${{ github.sha }}
          AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tools/dev.mts --profile node install
      - run: node tools/dev.mts --profile node build
      - run: node scripts/prepare-package.mjs
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - run: node scripts/check-publishable-packages.mjs
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - run: node scripts/pack-test.mjs
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_ROOT: ${{ github.workspace }}
      - name: Verify approved bootstrap writer evidence
        run: node scripts/npm-package-bootstrap-local-evidence.mjs --output "${RUNNER_TEMP}/npm-package-bootstrap-writer-evidence"
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
      - name: Retain bootstrap writer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-bootstrap-writer-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package-bootstrap-writer-evidence
          if-no-files-found: error
      - run: node tools/repository-command.mts tool buf-qualification:e2e:built
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}

  linux-registry:
    name: linux-registry
    # Independent qualification can start as soon as Dependency Review succeeds.
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Use a finite job-owned temporary directory
        shell: bash
        run: |
          set -Eeuo pipefail
          tmpdir="${RUNNER_TEMP}/linux-registry"
          mkdir -p "${tmpdir}"
          printf 'TMPDIR=%s\n' "${tmpdir}" >> "$GITHUB_ENV"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        id: setup-pnpm
        with: { version: "11.20.0", install: false }
      # registry-install-e2e reaches pack-test: managed generation2 consumer gates run on an explicit Node 24; the default Node 26 stays on PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.21.0" }
      - name: Retain Node 24 for managed generation2 consumer gates
        run: printf 'PACK_TEST_GENERATION2_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Install the clean Node/pnpm registry projection
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_SHA: ${{ github.sha }}
          AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tools/dev.mts --profile node install
      - run: node tools/dev.mts --profile node build
      - run: node tools/repository-command.mts tool registry-install-e2e:built
        working-directory: .worker-tmp/profiles/node-${{ github.sha }}
        env:
          AGENT_TEAMS_FOUNDATION_SOURCE_ROOT: ${{ github.workspace }}

  linux-bootstrap-evidence:
    name: linux-bootstrap-evidence
    needs: dependency-review
    if: ${{ github.event_name != 'pull_request' || (github.event.label.name == 'ci:full' || startsWith(github.event.label.name, 'ci:full:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env: { pnpm_config_pm_on_fail: ignore }
        id: setup-pnpm
        with: { version: "11.20.0", install: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
