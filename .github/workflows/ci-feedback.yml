name: CI feedback

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Default-branch code reads API metadata only and never executes pull request code or artifacts.
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  observe:
    name: advisory-ci-feedback
    if: ${{ github.event.workflow_run.path == '.github/workflows/ci.yml' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Build advisory CI feedback from API metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-feedback.mjs --output "${RUNNER_TEMP}/ci-signals.json"
      - name: Upload strict CI signal history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-signals-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/ci-signals.json
          if-no-files-found: error
          retention-days: 30
