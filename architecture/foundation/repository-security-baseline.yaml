schemaVersion: 1
workflowDirectory: .github/workflows
dependencyReviewWorkflow: .github/workflows/dependency-review.yml
sbomWorkflow: .github/workflows/ci.yml
privilegedJobs:
  - workflowPath: .github/workflows/reviewrouter.yml
    jobId: attest-dispatch
    permissions:
      contents: read
      pull-requests: read
      statuses: write
  - workflowPath: .github/workflows/reviewrouter.yml
    jobId: review
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
  - workflowPath: .github/workflows/release.yml
    jobId: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
  - workflowPath: .github/workflows/release.yml
    jobId: attest-release-pr
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
publishablePackageManifests:
  - packages/engineering-foundation/package.json
