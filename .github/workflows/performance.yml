name: TEST Bun lint and Oxlint source qualification
run-name: TEST Bun lint ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-bun-lint-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify-bun-lint:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/bun-lint-linux-e6878cbf-20261028-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUBJECT_SHA: e6878cbfc611c09910a95ba3eb1206e64c056045
      BASE_SHA: 046976291864b9f0281213018232272a1ac4ed8c
      SOURCE_TREE: f7a383456fde3a96734d1365c84fedfd81384667
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit frozen source and sole workflow overlay
        id: source
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = agent-teams-ai/engineering-foundation
          test "$GITHUB_REF" = refs/heads/test/bun-lint-linux-e6878cbf-20261028-v2
          test "$WORKFLOW_REF" = agent-teams-ai/engineering-foundation/.github/workflows/performance.yml@refs/heads/test/bun-lint-linux-e6878cbf-20261028-v2
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse "$SUBJECT_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git show -s --format=%P "$SUBJECT_SHA")" = bb44824262d9717f2d6f0fe84b85f0a5294874ae
          test "$(git show -s --format=%P bb44824262d9717f2d6f0fe84b85f0a5294874ae)" = "$BASE_SHA"
          test "$(git diff --name-only "$SUBJECT_SHA" HEAD)" = .github/workflows/performance.yml
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e node_modules
          test ! -e .git/objects/info/alternates
          evidence="${RUNNER_TEMP}/test-bun-lint-evidence"
          fixtures="${RUNNER_TEMP}/test-bun-lint-fixtures"
          mkdir -p "$evidence" "$fixtures/tmp" "$fixtures/cache" "$fixtures/helpers" "$fixtures/canary"
          printf 'EVIDENCE=%s\nTMPDIR=%s\nBUN_INSTALL_CACHE_DIR=%s\nnpm_config_cache=%s\nNX_CACHE_DIRECTORY=%s\nSUBJECT_ROOT=%s\nCANARY_FIXTURE=%s\n' "$evidence" "$fixtures/tmp" "$fixtures/cache/bun" "$fixtures/cache/npm" "$fixtures/cache/nx" "$GITHUB_WORKSPACE" "$fixtures/canary" >> "$GITHUB_ENV"
          cat > "$evidence/source.sha256" <<'SOURCE'
          a995fc35e9f7ac787c4baa14833577c3abdc38ca5d3c783a5926e82f7c02603f  .changeset/tidy-linters-watch.md
          f2b2c7c302ff02bb343391bd2da1f2c8d09a964d8ff68e49dd63e9848b283604  bun.lock
          054d3146bbd526f31cde3d25550c5926cf7555becdc9e8a543c381875a498d3d  package.json
          32c66be9ef71bbc5f5cb62611e3aff460caba62fd936b450ed840f9678ba7888  packages/stack-toolchain/README.md
          85c5f0f6058cf94e58121370eee79058b5cfa8ae583b55bd04e0576a6d88fa55  packages/stack-toolchain/presets/oxlint/type-aware.json
          075cc93b6298da99ee5db4fe0e893b9e6731291320a78c9c4e1521d491b4aca1  packages/stack-toolchain/src/features/toolchain-execution/adapters/commands.ts
          af174eec5c068c42b5f57b271dfd0f0792edcf4e1d85b7ba102c053048697bf6  packages/stack-toolchain/src/features/toolchain-execution/adapters/configuration.ts
          0bdb46a2e814df2b2e7973e8b3fbf3f0b360efbd1b7016bf42bf6a7ea003eac4  packages/stack-toolchain/src/features/toolchain-execution/adapters/executables.ts
          bc750261f12da2deaedf3f85ad160dd1ca3e86918fc247b8eeddfda909c3d458  packages/stack-toolchain/tests/configuration.test.ts
          8b1932a58e8e3854e002b99c961518d90c0c6f1dd8d323db9ce974d1ebdc7e74  packages/stack-toolchain/tests/executables.test.ts
          50af76fe08de5e7c088307b54bad8608e4d74bb3d5caada36203b925a6e0f3f8  packages/stack-toolchain/tests/lint-presets.test.ts
          78b30b51349bc1b9273bc6fd5ae548f5d98fbbdf27ad02af25fa57eab5bfe194  packages/stack-toolchain/toolchain-manifest.json
          aa5b4e61b49d4f8f8e21c13d66834e7c96d403dc0cdb2740415392f9be6db310  pnpm-lock.yaml
          41816c0c2ec22030e4b6c5b7cf5280ace845e8fdec68d880dac1f94a65b660b1  pnpm-workspace.yaml
          dec71e84c0ebd73e256aa6b229b7665d61e9c7031cf705d1d99e82bb52e982be  tools/qualify-native-tools.mts
          SOURCE
          cut -c67- "$evidence/source.sha256" | LC_ALL=C sort > "$evidence/expected-source-paths.txt"
          git diff --name-only "$BASE_SHA" "$SUBJECT_SHA" | LC_ALL=C sort > "$evidence/actual-source-paths.txt"
          cmp "$evidence/expected-source-paths.txt" "$evidence/actual-source-paths.txt"
          sha256sum -c "$evidence/source.sha256" > "$evidence/source-before.txt"
          git show -s --format='%H %T %P' HEAD "$SUBJECT_SHA" "$BASE_SHA" > "$evidence/git-binding.txt"
          sha256sum bun.lock pnpm-lock.yaml package.json pnpm-workspace.yaml > "$evidence/pins-before.txt"
          { uname -a; cat /etc/os-release; nproc; free -b; df -B1 "$RUNNER_TEMP"; } > "$evidence/resources-before.txt"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        id: setup-pnpm
        env: { pnpm_config_pm_on_fail: ignore }
        with:
          version: "11.20.0"
          install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Retain generation2 and managed Node24
        id: node24
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          test "$(node --version)" = v24.21.0
          printf 'PACK_TEST_GENERATION2_NODE=%s\nMANAGED_TEST_NODE24_SOURCE=%s\n' "$(node -p 'process.execPath')" "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - name: Retain managed Node26 source
        id: node26
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          test "$(node --version)" = v26.10.0
          printf 'MANAGED_TEST_NODE26_SOURCE=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bind physical tools and write external helper bytes
        id: tools
        env:
          PNPM_ENTRY: ${{ steps.setup-pnpm.outputs.bin-dest }}/pnpm
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          test "$(node --version)" = v26.11.1
          test "$(bun --version)" = 1.4.3
          test "$(pnpm --pm-on-fail=ignore --version)" = 11.20.0
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\nAGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE=%s\nAGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT=%s\nNODE_DISABLE_COMPILE_CACHE=1\n' "$(node -p 'process.execPath')" "$(realpath "$(command -v bun)")" "$PNPM_ENTRY" >> "$GITHUB_ENV"
          printf '%s\n' '{"private":true,"type":"module"}' > "${RUNNER_TEMP}/test-bun-lint-fixtures/helpers/package.json"
          git config --global user.name iliya
          git config --global user.email iliyazelenkog@gmail.com
          printf 'Node=%s\nBun=%s\npnpm=%s\n' "$(node --version)" "$(bun --version)" "$(pnpm --pm-on-fail=ignore --version)" > "$EVIDENCE/tools.txt"
          cat > "${RUNNER_TEMP}/test-bun-lint-fixtures/helpers/graph-proof.ts" <<'HELPER'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readFileSync, realpathSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { isAbsolute, join, relative } from "node:path";
          
          const root = realpathSync(process.cwd());
          const evidence = process.env["EVIDENCE"]; assert.ok(evidence);
          function json(path: string): Record<string, unknown> { const value: unknown = JSON.parse(readFileSync(path, "utf8")); assert.ok(value !== null && typeof value === "object" && !Array.isArray(value)); return value as Record<string, unknown>; }
          const consumer = createRequire(join(root, "package.json"));
          const registryManifest = realpathSync(consumer.resolve("stack-toolchain/package.json"));
          const installed = json(registryManifest); assert.equal(installed["name"], "stack-toolchain"); assert.equal(installed["version"], "0.1.0");
          const pins = json(join(registryManifest, "..", "toolchain-manifest.json"));
          const dependencies = installed["dependencies"] as Record<string, unknown>;
          const records: unknown[] = [];
          for (const [role, issuer, expected] of [
            ["published-consumer", registryManifest, { oxlint: "1.83.0", "oxlint-tsgolint": "7.0.2001" }],
            ["source-producer", join(root, "packages/stack-toolchain/package.json"), { oxlint: "1.90.0", "oxlint-tsgolint": "7.0.2005" }],
          ] as const) {
            const request = createRequire(issuer);
            for (const [name, version] of Object.entries(expected)) {
              if (role === "published-consumer") { assert.equal(dependencies[name], version); assert.equal(pins[name], version); }
              const path = realpathSync(request.resolve(`${name}/package.json`));
              const suffix = relative(join(root, "node_modules"), path); assert.ok(!suffix.startsWith("..") && !isAbsolute(suffix));
              const manifest = json(path); assert.equal(manifest["name"], name); assert.equal(manifest["version"], version);
              records.push({ role, issuer, name, version, physicalManifest: path, manifestSha256: createHash("sha256").update(readFileSync(path)).digest("hex") });
            }
            const oxlint = join(request.resolve("oxlint/package.json"), "..", "bin", "oxlint");
            const result = spawnSync(process.execPath, [oxlint, "--version"], { cwd: root, encoding: "utf8", timeout: 30_000 });
            assert.ifError(result.error); assert.equal(result.status, 0, result.stderr); assert.ok(result.stdout.includes(expected.oxlint));
            records.push({ role, actualVersionOutput: result.stdout });
          }
          writeFileSync(join(evidence, "installed-graph-proof.json"), JSON.stringify({ source: process.env["SUBJECT_SHA"], correction: "Catalog entries are not overrides. Frozen registry Stack0.1.0 owns nested old pins; source Stack0.1.1 owns new catalog pins. This proves installed roles only; Foundation census still must pass unchanged.", records }, null, 2));
          console.log("Actual published-consumer and source-producer graphs retain distinct exact native pins.");
          HELPER
          cat > "${RUNNER_TEMP}/test-bun-lint-fixtures/helpers/qualification.ts" <<'HELPER'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { existsSync, mkdirSync, readFileSync, readdirSync, realpathSync, rmSync, symlinkSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join, resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          
          const repository = realpathSync(required("SUBJECT_ROOT"));
          const evidence = realpathSync(required("EVIDENCE"));
          const root = realpathSync(required("CANARY_FIXTURE"));
          const entry = join(repository, "packages/stack-toolchain/dist/cli.js");
          const presetRoot = join(repository, "packages/stack-toolchain/presets/oxlint");
          const presets = [join(presetRoot, "type-aware.json"), join(presetRoot, "maintainability.json")];
          const output: unknown[] = [];
          let invocation = 0;
          function required(key: string): string { const value = process.env[key]; assert.ok(value, key); return value; }
          function put(name: string, value: unknown): void { writeFileSync(join(root, name), typeof value === "string" ? value : JSON.stringify(value)); }
          function run(command: string, args: readonly string[], expected?: number) {
            const before = readdirSync(tmpdir()).filter((name) => name.startsWith("stack-bun-lint-")).sort();
            const started = performance.now();
            const result = spawnSync(command, [...args], { cwd: root, env: process.env, encoding: "utf8", timeout: 45_000, maxBuffer: 4 * 1024 * 1024 });
            writeFileSync(join(evidence, `canary-invocation-${++invocation}.json`), JSON.stringify({ command, args, exit: result.status, signal: result.signal, stdout: result.stdout, stderr: result.stderr, error: result.error?.message }));
            assert.ifError(result.error); assert.equal(result.signal, null);
            if (expected !== undefined) assert.equal(result.status, expected, result.stdout + result.stderr);
            assert.deepEqual(readdirSync(tmpdir()).filter((name) => name.startsWith("stack-bun-lint-")).sort(), before);
            return { exit: result.status, stdout: result.stdout, stderr: result.stderr, milliseconds: performance.now() - started };
          }
          function configure(backend: "oxlint" | "bun-experimental", config = "lint.json", paths = ["src"]) {
            put("toolchain.config.json", { schemaVersion: 1, profile: "typescript-node", typecheck: { projects: ["tsconfig.json"] }, lint: { backend, config, paths }, format: { paths } });
          }
          function cli(expected: number) { return run(process.execPath, [entry, "lint", "--json"], expected); }
          const native = join(root, "node_modules/@oven/bun-linux-x64/bin/bun");
          assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64");
          const alias = JSON.parse(readFileSync(join(root, "node_modules/bun-lint/package.json"), "utf8")) as { name: string; version: string };
          assert.equal(alias.name, "bun"); assert.equal(alias.version, "1.4.4-canary.20261028.1+11c3671");
          const nativePackage = JSON.parse(readFileSync(join(root, "node_modules/@oven/bun-linux-x64/package.json"), "utf8")) as { name: string; version: string };
          assert.equal(nativePackage.name, "@oven/bun-linux-x64"); assert.equal(nativePackage.version, alias.version);
          const revision = run(native, ["--revision"], 0); assert.equal(revision.stdout.trim(), "1.4.4-canary.1+11c367163");
          output.push({ name: "native-identity", alias, nativePackage, native: realpathSync(native), sha256: createHash("sha256").update(readFileSync(native)).digest("hex"), revision });
          mkdirSync(join(root, "src")); mkdirSync(join(root, "outside"));
          put("tsconfig.json", { compilerOptions: { strict: true, noEmit: true, target: "ES2024", allowJs: true }, include: ["src"] });
          const bad = 'enum Fruit { Apple, Banana }\nexport const fruit: Fruit = 0;\ntype Data = { name: string; value: number };\nexport type Empty = Omit<Data, "name" | "value">;\nPromise.resolve(1);\nexport function tooMany(a:number,b:number,c:number,d:number,e:number,f:number) { return a+b+c+d+e+f; }\n';
          const typed = ["ts", "mts", "cts", "tsx"];
          const script = ["js", "mjs", "cjs", "jsx"];
          for (const ext of typed) put(`src/probe.${ext}`, bad);
          for (const ext of script) put(`src/probe.${ext}`, "Promise.resolve(1);\n");
          put("src/probe.vue", '<script lang="ts">\nexport const value = NaN === 1;\n</script>\n');
          put("outside/index.ts", "Promise.resolve(1);\n");
          put("lint.json", { extends: presets });
          const snapshot = () => Object.fromEntries(readdirSync(join(root, "src")).map((name) => [name, readFileSync(join(root, "src", name), "utf8")]));
          const original = snapshot();
          for (const backend of ["oxlint", "bun-experimental"] as const) {
            configure(backend); const failed = cli(1);
            for (const ext of typed) assert.ok(failed.stdout.includes(`probe.${ext}`), failed.stdout);
            for (const rule of ["no-unsafe-enum-assignment", "no-generated-empty-object-type", "no-floating-promises", "max-params"]) assert.ok(failed.stdout.includes(rule), rule);
            assert.ok(!failed.stdout.includes("outside/index.ts"));
            put("lint.json", { extends: presets, rules: { "typescript/no-unsafe-enum-assignment": "off" } });
            const off = cli(1); assert.ok(!off.stdout.includes("no-unsafe-enum-assignment")); assert.ok(off.stdout.includes("no-floating-promises"));
            put("lint.json", { extends: presets });
            output.push({ name: "strict-negative-explicit-off", backend, failed, off });
          }
          assert.deepEqual(snapshot(), original);
          const empty = join(root, "empty.toml"); put("empty.toml", "");
          const oxlint = join(repository, "node_modules/oxlint/bin/oxlint");
          const oxFiles = run(process.execPath, [oxlint, "--config", join(root, "lint.json"), "--debug", "files", "--", "src"], 0);
          const bunFiles = run(native, [`--config=${empty}`, "lint", "--no-script", "--config", join(root, "lint.json"), "--list-files", "--", "src"], 0);
          const normalize = (text: string) => text.trim().split(/\r?\n/u).map((file) => resolve(root, file)).sort();
          assert.deepEqual(normalize(bunFiles.stdout), normalize(oxFiles.stdout)); assert.equal(normalize(bunFiles.stdout).length, 9);
          output.push({ name: "nine-file-engine-census", oxFiles, bunFiles });
          for (const ext of typed) put(`src/probe.${ext}`, "export const value: number = 1;\n");
          for (const backend of ["oxlint", "bun-experimental"] as const) { configure(backend); output.push({ name: "fixed-positive-js-typed-exclusion", backend, result: cli(1) }); }
          // The Vue script still violates use-isnan; isolate JS-only typed exclusion below.
          put("src/probe.vue", '<script lang="ts">\nexport const value: number = 1;\n</script>\n');
          for (const backend of ["oxlint", "bun-experimental"] as const) { configure(backend); output.push({ name: "all-fixed-positive", backend, result: cli(0) }); }
          configure("bun-experimental");
          for (const unsupported of [
            { rules: { "id-match": ["error", "(?i)x"] } },
            { plugins: ["vue"] }, { plugins: ["jsdoc"] },
            { overrides: [{ files: ["**/+(x|y).ts"], rules: { "no-console": "error" } }] },
          ]) { put("lint.json", unsupported); output.push({ name: "unsupported-profile", unsupported, result: cli(2) }); }
          put("lint.json", { extends: presets }); put("src/probe.ts", "Promise.resolve(1);\n");
          const marker = join(root, "plugin.executed");
          put("ambient-plugin.js", `import { writeFileSync } from "node:fs"; writeFileSync(${JSON.stringify(marker)}, "executed"); export default { rules: {} };\n`);
          const local = join(root, "bunfig.toml"), ancestor = join(root, "..", "bunfig.toml");
          assert.equal(existsSync(local), false); assert.equal(existsSync(ancestor), false);
          for (const location of [local, ancestor]) {
            for (const specimen of [
              { name: "rule-off", toml: '[lint.rules]\n"typescript/no-floating-promises" = "off"\n', expected: 1 },
              { name: "partial-ignore", toml: `[lint]\nignorePatterns = [${JSON.stringify(location === local ? "src/probe.ts" : "canary/src/probe.ts")}]\n`, expected: 1 },
              { name: "plugin", toml: `[lint]\nplugins = [${JSON.stringify(join(root, "ambient-plugin.js"))}]\n`, expected: 1 },
              { name: "allow-unsupported", toml: "[lint]\nallowUnsupported = true\n", expected: 2 },
            ]) {
              writeFileSync(location, specimen.toml);
              if (specimen.name === "allow-unsupported") put("lint.json", { rules: { "unknown-rule": "error" } });
              try { const result = cli(specimen.expected); assert.equal(existsSync(marker), false); assert.equal(readFileSync(location, "utf8"), specimen.toml); output.push({ name: "ambient-bunfig", location, specimen, result }); }
              finally { rmSync(location); put("lint.json", { extends: presets }); }
            }
          }
          const links = join(root, "links"); mkdirSync(join(links, "shared"), { recursive: true });
          writeFileSync(join(links, "shared/main.json"), '{"extends":["./base.json"]}');
          writeFileSync(join(links, "shared/base.json"), '{"rules":{"no-console":"off"}}');
          writeFileSync(join(links, "base.json"), '{"rules":{"no-console":"error"}}');
          symlinkSync(join(links, "shared/main.json"), join(links, "root.json"));
          put("src/probe.ts", 'console.log("lexical");\n');
          const lexical = run(native, [`--config=${empty}`, "lint", "--no-script", "--config", join(links, "root.json"), "--format=json", "--", "src/probe.ts"], 1);
          assert.ok(lexical.stdout.includes("no-console")); output.push({ name: "actual-lexical-engine-context", lexical });
          writeFileSync(join(links, "base.json"), JSON.stringify({ jsPlugins: [join(root, "ambient-plugin.js")] }));
          for (const config of ["links/root.json", "links/nested.json"]) {
            put("links/nested.json", { extends: ["./root.json"] }); configure("bun-experimental", config); const result = cli(2); assert.ok(result.stdout.includes("TOOLCHAIN_LINT_CONFIG_EXECUTABLE")); assert.equal(existsSync(marker), false); output.push({ name: "lexical-symlink-refusal", config, result });
          }
          for (const name of ["left", "right"]) { mkdirSync(join(links, name)); symlinkSync(join(links, "shared/main.json"), join(links, name, "main.json")); writeFileSync(join(links, name, "base.json"), JSON.stringify(name === "left" ? {} : { jsPlugins: [join(root, "ambient-plugin.js")] })); }
          put("links/aliases.json", { extends: ["./left/main.json", "./right/main.json"] }); configure("bun-experimental", "links/aliases.json");
          const aliases = cli(2); assert.ok(aliases.stdout.includes("TOOLCHAIN_LINT_CONFIG_EXECUTABLE")); assert.equal(existsSync(marker), false); output.push({ name: "canonical-alias-cache-context", aliases });
          configure("bun-experimental"); put("lint.json", { extends: presets });
          type Report = { exitCode: number; details: unknown };
          type Input = { command: "lint"; cwd: string; signal: AbortSignal; budgetMs?: number };
          const api = await import(pathToFileURL(join(repository, "packages/stack-toolchain/dist/index.js")).href) as { runCommand: (input: Input) => Promise<Report> };
          const cancelled = await api.runCommand({ command: "lint", cwd: root, signal: AbortSignal.abort() }); assert.equal(cancelled.exitCode, 130);
          const timeout = await api.runCommand({ command: "lint", cwd: root, signal: new AbortController().signal, budgetMs: 1 }); assert.equal(timeout.exitCode, 2);
          output.push({ name: "caller-cancellation-and-deadline", cancelled, timeout });
          mkdirSync(join(root, "benchmark")); for (let index = 0; index < 20; index++) put(`benchmark/value-${index}.ts`, `export const value${index}: number = ${index};\n`);
          const timings: Record<string, ReturnType<typeof cli>[]> = {};
          for (let round = 0; round < 6; round++) for (const backend of round % 2 ? ["bun-experimental", "oxlint"] as const : ["oxlint", "bun-experimental"] as const) {
            configure(backend, "lint.json", ["benchmark"]); (timings[backend] ??= []).push(cli(0));
          }
          output.push({ name: "public-cli-full-guards-benchmark", scope: "20 owned TEST files, inherited strict+maintainability, 1 warmup + 5 alternating paired runs; no general parity/performance claim", timings });
          writeFileSync(join(evidence, "canary-controls.json"), JSON.stringify({ subject: required("SUBJECT_SHA"), sourceTree: required("SOURCE_TREE"), cases: output }, null, 2));
          console.log("Qualified bounded experimental public CLI corpus; raw results retained.");
          HELPER
          sha256sum "${RUNNER_TEMP}/test-bun-lint-fixtures/helpers/"*.ts > "$EVIDENCE/helper-bytes.sha256"
          cat > "$CANARY_FIXTURE/package.json" <<'MANIFEST'
          {"private":true,"type":"module","scripts":{"lint":"exit 42"},"devDependencies":{"bun-lint":"npm:bun@1.4.4-canary.20261028.1"}}
