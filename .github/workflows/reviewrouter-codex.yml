name: ReviewRouter Codex OAuth

run-name: ${{ format('ReviewRouter review PR {0} at {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

jobs:
  codex-review:
    name: codex-review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && (github.event.pull_request.draft == false || vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true') }}
    concurrency:
      group: reviewrouter-codex-oauth-${{ github.repository_id }}-codex-rotating-1316243988
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@08f6bc1481fd284fa82adfa47cda05c76b161b00
    with:
      runtime_ref: "08f6bc1481fd284fa82adfa47cda05c76b161b00"
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      review_head_sha: ${{ github.event.pull_request.head.sha }}
      provider_instance_id: "codex-rotating:1316243988"
      workflow_schema_version: 2
      max_changed_lines: ${{ vars.REVIEW_ROUTER_MAX_CHANGED_LINES }}
      review_timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}

  codex-refresh:
    name: codex-refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reviewrouter-codex-oauth-${{ github.repository_id }}-codex-rotating-1316243988
      cancel-in-progress: false
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      id-token: write
    steps:
      - name: ReviewRouter Codex OAuth refresh
        id: refresh_codex
        uses: 777genius/review-router@08f6bc1481fd284fa82adfa47cda05c76b161b00
        with:
          mode: codex-oauth-refresh
          api-url: "https://api.reviewrouter.site"
          provider-instance-id: "codex-rotating:1316243988"
          workflow-schema-version: "2"
          auth-json: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
