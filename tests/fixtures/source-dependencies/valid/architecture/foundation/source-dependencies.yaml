schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - packages/app/src
  - packages/core/src
boundaries:
  - id: app.surface
    roots:
      - packages/app/src
    entrypoints:
      - packages/app/src/index.ts
    allow:
      boundaries:
        - app.application
        - app.infrastructure
      packages: []
      builtins: []
      runtimeReferences: []
  - id: app.application
    roots:
      - packages/app/src/application
    entrypoints:
      - packages/app/src/application/execute.ts
    allow:
      boundaries:
        - app.domain
      packages:
        - "@fixture/core"
      builtins: []
      runtimeReferences: []
  - id: app.domain
    roots:
      - packages/app/src/domain
    entrypoints:
      - packages/app/src/domain/agent-id.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: app.infrastructure
    roots:
      - packages/app/src/infrastructure
    entrypoints:
      - packages/app/src/infrastructure/adapter.ts
    allow:
      boundaries:
        - app.application
        - app.domain
      packages:
        - "@fixture/core"
        - zod
      builtins:
        - node:path
      runtimeReferences: []
  - id: core.surface
    roots:
      - packages/core/src
    entrypoints:
      - packages/core/src/index.ts
    allow:
      boundaries:
        - core.domain
      packages: []
      builtins: []
      runtimeReferences: []
  - id: core.domain
    roots:
      - packages/core/src/domain
    entrypoints:
      - packages/core/src/domain/value.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
