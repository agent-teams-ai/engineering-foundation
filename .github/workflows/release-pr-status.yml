name: Release PR Status Bridge

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - changeset-release/main
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: foundation-release-pr-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  attest:
    name: attest-release-pr-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish protected CI results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [[ "${SOURCE_EVENT}" != "workflow_dispatch" ]]; then
            echo "Ignoring non-dispatched CI event: ${SOURCE_EVENT}"
            exit 0
          fi

          pr_head="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:changeset-release/main" \
            --jq '[.[] | select(.base.ref == "main")] | if length == 1 then .[0].head.sha else "" end')"
          if [[ "${pr_head}" != "${HEAD_SHA}" ]]; then
            echo "Release PR head does not match the completed CI run." >&2
            exit 1
          fi

          failed=0
          for context in check windows-check; do
            conclusion="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name == \"${context}\")] | if length == 1 then .[0].conclusion else \"invalid\" end")"
            case "${conclusion}" in
              success)
                state=success
                ;;
              failure|cancelled|timed_out)
                state=failure
                failed=1
                ;;
              *)
                state=error
                failed=1
                ;;
            esac

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="${state}" \
              -f context="${context}" \
              -f description="Release PR ${context}: ${conclusion}" \
              -f target_url="${RUN_URL}" >/dev/null
          done

          exit "${failed}"
