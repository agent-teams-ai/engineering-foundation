name: Oxfmt managed runtime source probe
on:
  push:
    branches:
      - test/oxfmt-managed-runtime-default-probe-20261128
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - name: Format with the exact Stack Toolchain Oxfmt version
        shell: bash
        run: |
          set -Eeuo pipefail
          npm exec --yes --package=oxfmt@0.74.0 -- oxfmt --config packages/stack-toolchain/presets/format.json -- packages/docs-protocol-agent-teams/tests/managed-runtime-default-probe.test.mjs
          cat packages/docs-protocol-agent-teams/tests/managed-runtime-default-probe.test.mjs
