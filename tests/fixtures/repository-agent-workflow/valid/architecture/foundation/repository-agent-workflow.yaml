schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:fast:files
    extensions: [.js, .mjs, .ts, .tsx]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx]
    passPaths: false
fullScanPaths:
  - .github/workflows
  - pnpm-lock.yaml
