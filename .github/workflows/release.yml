name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pullRequestNumber: ${{ steps.changesets.outputs.pullRequestNumber }}
      pullRequestHeadSha: ${{ steps.release-pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release:publish
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind release pull request revision
        id: release-pr
        if: ${{ steps.changesets.outputs.pullRequestNumber != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUEST: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail

          read -r state head_ref head_sha base_ref base_sha < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" \
            --jq '[.state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv')
          if [[ "${state}" != "open" || "${head_ref}" != "changeset-release/main" || "${base_ref}" != "main" ]]; then
            echo "Changesets output does not identify the expected open release pull request." >&2
            exit 1
          fi
          printf 'head_sha=%s\n' "${head_sha}" >> "${GITHUB_OUTPUT}"

  attest-release-pr:
    name: attest-release-pr
    needs: release
    if: ${{ needs.release.outputs.pullRequestNumber != '' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch and attest release pull request checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PULL_REQUEST: ${{ needs.release.outputs.pullRequestNumber }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          read -r state head_ref head_sha base_ref base_sha < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}" \
            --jq '[.state, .head.ref, .head.sha, .base.ref, .base.sha] | @tsv')
          if [[ "${state}" != "open" || "${head_ref}" != "changeset-release/main" || "${base_ref}" != "main" ]]; then
            echo "Changesets output does not identify the expected open release pull request." >&2
            exit 1
          fi

          ci_contexts=(check windows-check)
          release_gate_context=ReviewGate

          post_status() {
            local context="$1"
            local status_state="$2"
            local description="$3"
            local target_url="$4"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state="${status_state}" \
              -f context="${context}" \
              -f description="${description}" \
              -f target_url="${target_url}" >/dev/null
          }

          for context in "${ci_contexts[@]}"; do
            post_status "${context}" pending "Release PR ${context}: dispatched" "${RELEASE_RUN_URL}"
          done
          post_status "${release_gate_context}" pending "Validating generated release evidence" "${RELEASE_RUN_URL}"

          git fetch --no-tags origin "${base_sha}" "${head_sha}"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PULL_REQUEST}/files?per_page=100" | \
            node scripts/check-release-pr-files.mjs --base "${base_sha}" --head "${head_sha}"; then
            post_status "${release_gate_context}" failure "Release PR contains unreviewed changes" "${RELEASE_RUN_URL}"
            exit 1
          fi

          gh workflow run ci.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref changeset-release/main

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
            all_completed=1
            for context in "${ci_contexts[@]}"; do
              check_status="$(jq -r --arg context "${context}" \
                '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | .status // "missing"' \
                <<<"${checks}")"
              if [[ "${check_status}" != "completed" ]]; then
                all_completed=0
              fi
            done
            if (( all_completed == 1 )); then
              break
            fi
            sleep 5
          done

          if (( all_completed != 1 )); then
            for context in "${ci_contexts[@]}"; do
              post_status "${context}" error "Release PR ${context}: CI timeout" "${RELEASE_RUN_URL}"
            done
            post_status "${release_gate_context}" error "Release PR CI timed out" "${RELEASE_RUN_URL}"
            echo "Timed out waiting for release pull request CI." >&2
            exit 1
          fi

          failed=0
          for context in "${ci_contexts[@]}"; do
            read -r conclusion target_url < <(jq -r --arg context "${context}" \
              '[.check_runs[] | select(.app.slug == "github-actions" and .name == $context)] | sort_by(.id) | last | [.conclusion, .details_url] | @tsv' \
              <<<"${checks}")
            case "${conclusion}" in
              success)
                status_state=success
                ;;
              failure|cancelled|timed_out|startup_failure)
                status_state=failure
                failed=1
                ;;
              *)
                status_state=error
                failed=1
                ;;
            esac
            post_status "${context}" "${status_state}" "Release PR ${context}: ${conclusion}" "${target_url}"
          done

          if (( failed == 0 )); then
            post_status "${release_gate_context}" success "Generated release evidence and CI passed" "${RELEASE_RUN_URL}"
          else
            post_status "${release_gate_context}" failure "Generated release CI failed" "${RELEASE_RUN_URL}"
          fi

          exit "${failed}"
