name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: resolve-pr
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || {
            echo "pr_number must be a positive integer" >&2
            exit 1
          }
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          [[ "${state}" == "open" ]] || {
            echo "Review target must be an open pull request." >&2
            exit 1
          }
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          [[ "${head_repo}" == "${GITHUB_REPOSITORY}" ]] || {
            echo "Review target must come from this repository." >&2
            exit 1
          }
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Review target head must be a full commit SHA." >&2
            exit 1
          }
          {
            echo "number=${pr_number}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

  review:
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot' }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: agent-teams-ai/.github/.github/workflows/reviewrouter-reusable.yml@b93ce0a25ccb950117b0a273596b9b5091301739
    with:
      pr_number: ${{ needs.resolve.outputs.number }}
      review_head_sha: ${{ needs.resolve.outputs.head_sha }}
      provider_instance_id: "codex-rotating:1316243988"
      review_drafts: ${{ vars.REVIEW_ROUTER_REVIEW_DRAFTS == 'true' }}
      timeout_minutes: ${{ fromJSON(vars.REVIEW_ROUTER_TIMEOUT_MINUTES || '60') }}
      max_changed_lines: ${{ fromJSON(vars.REVIEW_ROUTER_MAX_CHANGED_LINES || '250000') }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}

  required-review:
    name: ReviewRouter
    needs: [resolve, review]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful independent review
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          set -euo pipefail
          [[ "${RESOLVE_RESULT}" == "success" && "${REVIEW_RESULT}" == "success" ]]

  codex-refresh:
    name: codex-refresh
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: ReviewRouter Codex OAuth refresh
        uses: 777genius/review-router@e982a5e3aebe71404dac948fd67cb7291e8be0fb
        with:
          mode: codex-oauth-refresh
          api-url: "https://api.reviewrouter.site"
          provider-instance-id: "codex-rotating:1316243988"
          workflow-schema-version: "2"
          auth-json: ${{ secrets.REVIEWROUTER_CODEX_AUTH_JSON }}
