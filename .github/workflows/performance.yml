      - name: Provision existing qualified npm migration verifier
        id: npmverifier
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -uo pipefail
          prefix="${RUNNER_TEMP}/test-format-npm-verifier"
          mkdir -p "$prefix"
          printf '%s\n' npm install --prefix "$prefix" --no-save --package-lock=false --ignore-scripts npm@11.19.0 > "$EVIDENCE/npm-verifier.argv.txt"
          if npm install --prefix "$prefix" --no-save --package-lock=false --ignore-scripts npm@11.19.0 > "$EVIDENCE/npm-verifier.merged.log" 2>&1; then code=0; else code=$?; fi
          cat "$EVIDENCE/npm-verifier.merged.log"
          if [[ "$code" -eq 0 ]]; then
            export PATH="$prefix/node_modules/.bin:$PATH"
            { command -v npm; npm --version; } > "$EVIDENCE/npm-verifier.selection.txt"
            test "$(npm --version)" = 11.19.0 || code=$?
            if [[ "$code" -eq 0 ]]; then printf '%s\n' "$prefix/node_modules/.bin" >> "$GITHUB_PATH"; fi
          fi
          printf '%s\n' "$code" > "$EVIDENCE/npm-verifier.exit.txt"
          exit "$code"
      - name: Install and build the canonical isolated Node profile
        id: nodeprofile
        if: ${{ !cancelled() && steps.npmverifier.outcome == 'success' }}
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -Eeuo pipefail
          mkdir -p .worker-tmp/profiles
          profile="$(mktemp -d "$GITHUB_WORKSPACE/.worker-tmp/profiles/check-changed-diagnostic-XXXXXX")"
          printf 'DIAGNOSTIC_PROFILE_ROOT=%s\n' "$profile" >> "$GITHUB_ENV"
          export AGENT_TEAMS_FOUNDATION_PROFILE_ROOT="$profile"
          export AGENT_TEAMS_FOUNDATION_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export AGENT_TEAMS_FOUNDATION_SOURCE_SHA="$GITHUB_SHA"
          export AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE=node
          printf '%s\n' node tools/dev.mts --profile node install > "$EVIDENCE/node-profile-install.argv.txt"
          if node tools/dev.mts --profile node install > "$EVIDENCE/node-profile-install.log" 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > "$EVIDENCE/node-profile-install.exit.txt"
          test "$code" -eq 0
          printf '%s\n' node tools/dev.mts --profile node build > "$EVIDENCE/node-profile-build.argv.txt"
          if node tools/dev.mts --profile node build > "$EVIDENCE/node-profile-build.log" 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > "$EVIDENCE/node-profile-build.exit.txt"
          exit "$code"
      - name: Materialize and typecheck the bounded TEST capture
        id: diagnostichelper
        if: ${{ !cancelled() && steps.nodeprofile.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$EVIDENCE/capture-node-profile-causal.ts" <<'CAPTURE_TS'
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { accessSync, constants, cpSync, lstatSync, mkdirSync, mkdtempSync, readFileSync, readdirSync, readlinkSync, realpathSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { tmpdir } from "node:os";
          import { delimiter, dirname, join, relative, resolve, sep } from "node:path";

          const profile = realpathSync(process.argv[2]!);
          const source = realpathSync(process.argv[3]!);
          const output = resolve(process.argv[4]!);
          mkdirSync(output, { recursive: true });
          const env = { ...process.env };
          const results: Record<string, unknown>[] = [];
          function json(name: string, value: unknown): void { writeFileSync(join(output, name + ".json"), JSON.stringify(value, null, 2) + "\n"); }
          function identity(path: string): unknown { const physical = realpathSync(path); return { requested: path, physical, sha256: createHash("sha256").update(readFileSync(physical)).digest("hex") }; }
          function executable(name: string): string {
            for (const directory of (env.PATH ?? "").split(delimiter)) { const candidate = join(directory, name); try { accessSync(candidate, constants.X_OK); return candidate; } catch { /* Continue the PATH search. */ } }
            throw new Error("Missing executable: " + name);
          }
          function capture(name: string, command: string, args: readonly string[], cwd: string, environment: NodeJS.ProcessEnv, timeout: number): string {
            const result = spawnSync(command, [...args], { cwd, env: environment, timeout, maxBuffer: 16 * 1024 * 1024, encoding: "buffer" });
            const stdout = result.stdout ?? Buffer.alloc(0);
            writeFileSync(join(output, name + ".stdout.txt"), stdout);
            writeFileSync(join(output, name + ".stderr.txt"), result.stderr ?? Buffer.alloc(0));
            const receipt = { name, command, args, cwd, timeoutMs: timeout, outputCapBytes: 16 * 1024 * 1024, status: result.status, signal: result.signal, errorCode: (result.error as NodeJS.ErrnoException | undefined)?.code ?? null, errorMessage: result.error?.message ?? null };
            results.push(receipt); json(name + ".result", receipt); return stdout.toString("utf8");
          }
          const relevantNames = ["PATH", "NODE_PATH", "NODE_OPTIONS", "NODE_DISABLE_COMPILE_CACHE", "TMPDIR", "RUNNER_TEMP", "npm_config_user_agent", "npm_command", "npm_config_cache", "AGENT_TEAMS_FOUNDATION_SOURCE_ROOT", "AGENT_TEAMS_FOUNDATION_SOURCE_SHA", "AGENT_TEAMS_FOUNDATION_PROFILE_ROOT", "AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE", "AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE", "AGENT_TEAMS_FOUNDATION_BUN_EXECUTABLE", "AGENT_TEAMS_FOUNDATION_PNPM_ENTRYPOINT"];
          json("environment", { cwd: process.cwd(), profile, source, nodeVersion: process.version, node: identity(process.execPath), npm: identity(executable("npm")), variables: Object.fromEntries(relevantNames.map((key) => [key, env[key] ?? null])) });
          const fromProfile = createRequire(join(profile, "tests/public-docs-documented.test.ts"));
          const fromSource = createRequire(join(source, "tests/public-docs-documented.test.ts"));
          const managerRoot = dirname(fromProfile.resolve("pnpm"));
          const sourceManagerRoot = dirname(fromSource.resolve("pnpm"));
          const cli = join(createRequire(join(profile, "packages/stack-toolchain/tests/lint-presets.test.ts")).resolve("oxlint/package.json"), "..", "bin", "oxlint");
          json("entrypoints", { managerRoot, sourceManagerRoot, pnpm: identity(join(managerRoot, "bin/pnpm.mjs")), oxlint: identity(cli), oxlintNative: identity(createRequire(cli).resolve("@oxlint/binding-linux-x64-gnu")), sourcePackageManager: (JSON.parse(readFileSync(join(source, "package.json"), "utf8")) as { packageManager: string }).packageManager, profilePackageManager: (JSON.parse(readFileSync(join(profile, "package.json"), "utf8")) as { packageManager: string }).packageManager });
          const external = mkdtempSync(join(tmpdir(), "TEST-profile-causal-"));
          const probe = join(external, "probe.ts");
          writeFileSync(probe, "export const probe = 1;\n");
          json("external-probe", { external, probe, identity: identity(probe) });
          capture("npm-version", "npm", ["--version"], external, env, 30_000);
          const npmHelp = capture("npm-pack-help", "npm", ["pack", "--help"], external, env, 30_000);
          const oxlintHelp = capture("oxlint-help", process.execPath, [cli, "--help"], external, env, 30_000);
          capture("oxlint-profile-baseline", process.execPath, [cli, "--rules", "--format=json"], profile, env, 30_000);
          capture("oxlint-external-cwd", process.execPath, [cli, "--rules", "--format=json"], external, env, 30_000);
          capture("oxlint-external-cwd-explicit-probe", process.execPath, [cli, "--rules", "--format=json", probe], external, env, 30_000);
          capture("oxlint-profile-cwd-explicit-probe", process.execPath, [cli, "--rules", "--format=json", probe], profile, env, 30_000);
          for (const flag of ["--no-ignore", "--no-ignore-parent"]) {
            if (new RegExp("(?:^|\\s)" + flag + "(?:\\s|$)", "u").test(oxlintHelp)) capture("oxlint-profile-" + flag.slice(2), process.execPath, [cli, "--rules", "--format=json", flag], profile, env, 30_000);
            else json("oxlint-profile-" + flag.slice(2) + ".unsupported", { flag, disposition: "not-executed-not-in-actual-pinned-help" });
          }
          interface CensusRow { path: string; mode: number; kind: string; bytes?: number; sha256?: string; linkTarget?: string; externalTarget?: boolean; linkResolutionError?: string; }
          function census(root: string, label: string): { rows: CensusRow[]; digest: string; bytes: number } {
            const rows: CensusRow[] = []; let bytes = 0;
            function visit(path: string): void {
              if (rows.length >= 20_000) throw new Error("Census entry cap exceeded");
              const stat = lstatSync(path); const name = relative(root, path) || ".";
              if (stat.isSymbolicLink()) { const row: CensusRow = { path: name, mode: stat.mode & 0o7777, kind: "symlink", linkTarget: readlinkSync(path) }; try { const resolved = realpathSync(path); row.externalTarget = resolved !== root && !resolved.startsWith(root + sep); } catch (error) { row.linkResolutionError = (error as NodeJS.ErrnoException).code ?? "unknown"; } rows.push(row); }
              else if (stat.isDirectory()) { rows.push({ path: name, mode: stat.mode & 0o7777, kind: "directory" }); for (const entry of readdirSync(path).sort()) visit(join(path, entry)); }
              else if (stat.isFile()) { bytes += stat.size; if (stat.size > 64 * 1024 * 1024 || bytes > 256 * 1024 * 1024) throw new Error("Census byte cap exceeded"); rows.push({ path: name, mode: stat.mode & 0o7777, kind: "file", bytes: stat.size, sha256: createHash("sha256").update(readFileSync(path)).digest("hex") }); }
              else throw new Error("Unexpected package member kind");
            }
            visit(root); const digest = createHash("sha256").update(JSON.stringify(rows)).digest("hex"); json(label, { root, rows, digest, bytes }); return { rows, digest, bytes };
          }
          const sourceCensus = census(realpathSync(sourceManagerRoot), "pnpm-bun-source-census");
          const profileCensus = census(realpathSync(managerRoot), "pnpm-node-profile-census");
          const copiedManager = join(external, "copied-pnpm");
          cpSync(managerRoot, copiedManager, { recursive: true, dereference: false, preserveTimestamps: true, verbatimSymlinks: true });
          const copiedCensus = census(realpathSync(copiedManager), "pnpm-copied-census");
          json("census-comparison", { bunVsNodeEqual: sourceCensus.digest === profileCensus.digest, copyVsNodeEqual: copiedCensus.digest === profileCensus.digest, copyContainsExternalSymlinks: copiedCensus.rows.some((row) => row.externalTarget), sourceBytes: sourceCensus.bytes, nodeBytes: profileCensus.bytes, copiedBytes: copiedCensus.bytes });
          function pack(name: string, cwd: string, extra: readonly string[]): void {
            const root = join(external, name); mkdirSync(root); const cache = join(root, "npm-cache"); mkdirSync(cache);
            const environment: NodeJS.ProcessEnv = { ...env, npm_config_cache: cache };
            for (const key of Object.keys(environment)) if (/^(?:NODE_(?:PATH|OPTIONS)|npm_config_user_agent)$/iu.test(key)) delete environment[key];
            capture(name, "npm", ["pack", ...extra, "--ignore-scripts", "--json", "--pack-destination", root], cwd, environment, 120_000);
            let debug = "";
            try { for (const file of readdirSync(join(cache, "_logs")).filter((name) => name.endsWith("debug-0.log"))) debug += "log=" + file + "\n" + readFileSync(join(cache, "_logs", file), "utf8").split(/\r?\n/u).filter((line) => /^\d+ (?:error|verbose (?:stack|title|cwd|node|npm|exit|code)) /u.test(line)).join("\n") + "\n"; }
            catch (error) { debug = "debug-log-code=" + ((error as NodeJS.ErrnoException).code ?? "unknown") + "\n"; }
            writeFileSync(join(output, name + ".safe-debug.txt"), debug);
          }
          pack("npm-manager-cwd-baseline", managerRoot, []);
          pack("npm-explicit-target-external-cwd", external, [managerRoot]);
          if (/--workspaces(?:\s|\]|$)/u.test(npmHelp)) pack("npm-manager-cwd-workspaces-false", managerRoot, ["--workspaces=false"]);
          else json("npm-workspaces-false.unsupported", { disposition: "not-executed-not-in-actual-npm11.19-help" });
          if (copiedCensus.digest === profileCensus.digest && !copiedCensus.rows.some((row) => row.externalTarget || row.linkResolutionError)) pack("npm-copied-manager-cwd", copiedManager, []);
          else json("npm-copied-manager-cwd.invalid", { disposition: "not-executed-copy-is-not-byte-mode-link-identical-and-closed" });
          json("results", { scope: "causal-controls-only-no-product-policy-or-test-changes", results });
          process.exitCode = results.some((result) => result.status !== 0 || result.errorCode !== null || result.signal !== null) ? 1 : 0;
          CAPTURE_TS
          sha256sum "$EVIDENCE/capture-node-profile-causal.ts" > "$EVIDENCE/capture-node-profile.sha256"
          node "$DIAGNOSTIC_PROFILE_ROOT/node_modules/typescript/bin/tsc" --version > "$EVIDENCE/capture-typecheck-version.txt"
          node "$DIAGNOSTIC_PROFILE_ROOT/node_modules/typescript/bin/tsc" --ignoreConfig --noEmit --strict --skipLibCheck --module nodenext --target es2024 --types node --typeRoots "$DIAGNOSTIC_PROFILE_ROOT/node_modules/@types" "$EVIDENCE/capture-node-profile-causal.ts" > "$EVIDENCE/capture-typecheck.log" 2>&1
      - name: Capture causal ignored-CWD workspace and exact package-copy controls
        id: diagnostics
        if: ${{ !cancelled() && steps.diagnostichelper.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          { command -v npm; npm --version; } > "$EVIDENCE/diagnostic.npm-selection.txt"
          test "$(npm --version)" = 11.19.0 || exit 1
          helper="$EVIDENCE/capture-node-profile-causal.ts"
          node="$AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE"
          export AGENT_TEAMS_FOUNDATION_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export AGENT_TEAMS_FOUNDATION_SOURCE_SHA="$GITHUB_SHA"
          export AGENT_TEAMS_FOUNDATION_PROFILE_ROOT="$DIAGNOSTIC_PROFILE_ROOT"
          export AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE=node
          if (cd "$DIAGNOSTIC_PROFILE_ROOT" && "$node" "$helper" "$DIAGNOSTIC_PROFILE_ROOT" "$GITHUB_WORKSPACE" "$EVIDENCE/causal-controls") > "$EVIDENCE/causal-controls.driver.log" 2>&1; then code=0; else code=$?; fi
          printf 'causal_controls=%s\nqualification=diagnostic-only-expected-baseline-failures-recorded-individually\n' "$code" > "$EVIDENCE/diagnostic-matrix.txt"
          exit "$code"
      - name: Always retain honest outcomes and terminal source custody
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          MANAGED_RESULT: ${{ steps.managed.outcome }}
          NPM_VERIFIER_RESULT: ${{ steps.npmverifier.outcome }}
          NODE_PROFILE_RESULT: ${{ steps.nodeprofile.outcome }}
          DIAGNOSTIC_HELPER_RESULT: ${{ steps.diagnostichelper.outcome }}
          DIAGNOSTICS_RESULT: ${{ steps.diagnostics.outcome }}
        shell: bash
        run: |
          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE NODE_COMPILE_CACHE NODE_OPTIONS NODE_PATH AGENT_TEAMS_FOUNDATION_PROFILE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_ROOT AGENT_TEAMS_FOUNDATION_SOURCE_SHA AGENT_TEAMS_FOUNDATION_RUNTIME_PROFILE
          set -uo pipefail
          evidence="${RUNNER_TEMP}/test-format-coverage"
          mkdir -p "$evidence"
          printf 'install=%s\nbuild=%s\nmanaged=%s\nnpm_verifier=%s\nnode_profile=%s\ndiagnostic_helper=%s\ndiagnostics=%s\nqualification=isolated-node-profile-causal-controls-only\n' "$INSTALL_RESULT" "$BUILD_RESULT" "$MANAGED_RESULT" "$NPM_VERIFIER_RESULT" "$NODE_PROFILE_RESULT" "$DIAGNOSTIC_HELPER_RESULT" "$DIAGNOSTICS_RESULT" > "$evidence/phase-outcomes.txt"
          printf 'repository=%s\nref=%s\nevent=%s\nrun_id=%s\nattempt=%s\nprovider_T=%s\nworkflow_sha=%s\nsource_S=%s\nbase=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$WORKFLOW_SHA" "$SUBJECT_SHA" "$BASE_SHA" > "$evidence/provider-binding.txt"
          code=0
          if [[ -f "$evidence/source.sha256" ]]; then sha256sum -c "$evidence/source.sha256" > "$evidence/source-after.txt" 2>&1 || code=1; else code=1; fi
          git diff --exit-code HEAD > "$evidence/tracked-after.txt" 2>&1 || code=1
          git ls-files --others --exclude-standard > "$evidence/untracked-after.txt" || code=1
          test ! -s "$evidence/untracked-after.txt" || code=1
          sha256sum bun.lock pnpm-lock.yaml .node-version architecture/foundation/repository-runtime.json toolchain.config.json > "$evidence/pins-after.txt" 2>&1 || code=1
          shopt -s nullglob
          for file in .worker-tmp/check-changed-*.log; do cp "$file" "$evidence/$(basename "$file")"; done
          df -B1 "$RUNNER_TEMP" > "$evidence/resources-after.txt"
          for file in "${RUNNER_TEMP}"/f/quality-source-cli-failure-*/invocation.json; do cp "$file" "$evidence/$(basename "$(dirname "$file")").json"; done
          printf '%s\n' "$code" > "$evidence/terminal-custody.exit.txt"
          find "$evidence" -type f ! -name artifacts.sha256 ! -name artifact-sizes.txt -printf '%P %s\n' | LC_ALL=C sort > "$evidence/artifact-sizes.txt"
          (cd "$evidence" && find . -type f ! -name artifacts.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$evidence/artifacts.sha256"
          exit "$code"
      - name: Upload only explicit TEST evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TEST-format-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-format-coverage/
          if-no-files-found: error
          retention-days: 30
