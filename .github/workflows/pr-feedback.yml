name: PR Feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Feedback only supersedes feedback. Full CI binds its own frozen head/base.
  group: ${{ format('foundation-feedback-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
          vulnerability-check: true
          warn-only: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: engineering-foundation-sbom.spdx.json
          upload-release-assets: false

  pr-feedback:
    name: pr-feedback
    needs: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Bind physical Node for the Bun-hosted public CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE="$(node -p 'process.execPath')"
          printf 'AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE=%s\n' "${AGENT_TEAMS_FOUNDATION_NODE_EXECUTABLE}" >> "$GITHUB_ENV"
      - run: bun tools/dev.mts install
      - run: bun tools/dev.mts build
      - name: Check the complete pull-request delta
        env:
          FOUNDATION_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun packages/engineering-foundation/dist/cli.js agent-workflow changed --consumer . --base "$FOUNDATION_PR_BASE_SHA"
