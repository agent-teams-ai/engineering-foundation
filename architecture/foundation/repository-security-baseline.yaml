schemaVersion: 1
workflowDirectory: .github/workflows
dependencyReview:
  workflowPath: .github/workflows/ci.yml
  jobId: dependency-review
  baseRef: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
  headRef: ${{ github.event.pull_request.head.sha || github.sha }}
  failOnSeverity: moderate
sbomWorkflow: .github/workflows/ci.yml
allowedContainerImages: []
allowedUses:
  - uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@08f6bc1481fd284fa82adfa47cda05c76b161b00
    transitiveUses: []
  - uses: 777genius/review-router/.github/workflows/reviewrouter-interaction-reusable.yml@5da51b7b71b1db9ce531f946ec2bb90411a31300
    transitiveUses: []
  - uses: 777genius/review-router@08f6bc1481fd284fa82adfa47cda05c76b161b00
    transitiveUses: []
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    transitiveUses: []
  - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
    transitiveUses: []
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    transitiveUses: []
  - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
    transitiveUses: []
  - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
    transitiveUses: []
  - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
    transitiveUses: []
  - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
    transitiveUses: []
  - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
    transitiveUses: []
privilegedJobs:
  - workflowPath: .github/workflows/codeql.yml
    jobId: analyze
    permissions:
      contents: read
      security-events: write
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-codex.yml
    jobId: codex-refresh
    permissions:
      id-token: write
  - workflowPath: .github/workflows/reviewrouter-interaction.yml
    jobId: interaction
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
      id-token: write
  - workflowPath: .github/workflows/release.yml
    jobId: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
  - workflowPath: .github/workflows/review-gate.yml
    jobId: review-gate
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
  - workflowPath: .github/workflows/release.yml
    jobId: attest-release-pr
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
publishablePackageManifests:
  - packages/engineering-foundation/package.json
